<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents — KṬP Saikhamakawn</title>
  <meta name="description" content="Access sermon notes, Bible study materials, and spiritual messages shared at KṬP Saikhamakawn church services and youth fellowships.">
  <meta name="keywords" content="KTP Saikhamakawn sermons, Bible study, Christian sermon notes, Mizo message guidelines">

  <!-- Open Graph -->
  <meta property="og:title" content="Sermons — KṬP Saikhamakawn">
  <meta property="og:description" content="Access sermon notes, Bible study materials, and spiritual messages.">
  <meta property="og:image" content="assets/images/logo.png">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <!-- Preconnect for Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css?v=221">
  <link rel="stylesheet" href="assets/css/base.css?v=221">
  <link rel="stylesheet" href="assets/css/mizo-patterns.css?v=221">
  <link rel="stylesheet" href="assets/css/animations.css?v=221">
  <link rel="stylesheet" href="assets/css/components.css?v=221">
  <link rel="stylesheet" href="assets/css/layout.css?v=221">
  <link rel="stylesheet" href="assets/css/pages.css?v=221">
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="site-header"></header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Page Header -->
    <section class="page-title-section mizo-pattern-subtle" style="padding: var(--sp-3) 0 var(--sp-2) 0;">
      <div class="container">
        <h1 class="reveal" style="font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 0;">📖 Documents</h1>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="section-sm" style="padding-top: var(--sp-2); padding-bottom: var(--sp-2);">
      <div class="container">
        <div style="display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3);">
          
          <!-- Search input and Sort Selection -->
          <div style="display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; justify-content: space-between;">
            <div class="search-container">
              <span class="search-icon">🔍</span>
              <input type="text" id="sermon-search" class="search-input" placeholder="Search documents by title, speaker, scripture, or keywords...">
              <span class="search-clear" id="search-clear-btn" role="button" aria-label="Clear search">&times;</span>
            </div>
          </div>

          <!-- Category Chips -->
          <div>
            <p style="font-size: var(--fs-xs); color: var(--color-text-tertiary); font-weight: var(--fw-semibold); margin-bottom: var(--sp-2); text-transform: uppercase; letter-spacing: 0.5px;">Topics / Types</p>
            <div class="filter-bar no-scrollbar" id="category-chips" style="overflow-x: auto; padding-bottom: var(--sp-1);">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Selection Toolbar for Bulk Download -->
          <div id="selection-toolbar" class="floating-selection-toolbar" style="display: none;">
            <div style="display: flex; align-items: center; gap: var(--sp-3);">
              <label style="display: flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-medium);">
                <input type="checkbox" id="select-all-cb" style="width: 16px; height: 16px; cursor: pointer;">
                Select All
              </label>
              <span id="selected-count" style="font-size: var(--fs-xs); color: var(--color-text-secondary); background: var(--color-bg-hover); padding: 2px 8px; border-radius: 12px; font-weight: var(--fw-bold);">0</span>
            </div>
            <div style="display: flex; gap: var(--sp-1); align-items: center;">
              <button id="btn-bulk-save" class="btn-icon" disabled title="Save Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
              <button id="btn-bulk-download" class="btn-icon" disabled title="Download Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>
            </div>
          </div>

          <!-- Results count/info and Sort -->
          <div class="results-info" style="margin-bottom: var(--sp-2);">
            <span class="results-count" id="sermon-count">Loading documents...</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <label for="sermon-sort" style="font-size: 12px; color: var(--color-text-tertiary); font-weight: var(--fw-medium);">Sort:</label>
              <select id="sermon-sort" class="filter-select" style="padding: 4px 8px; padding-right: 24px; font-size: 13px; height: 30px; border-radius: var(--radius-md); background-position: right 8px center; background-size: 12px; border: 1px solid var(--color-border); background-color: var(--color-bg-card); cursor: pointer;">
                <option value="manual">Manual</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="a-z">A-Z</option>
                <option value="z-a">Z-A</option>
              </select>
            </div>
          </div>

        </div>

        <!-- Sermons List (1-column layout) -->
        <div class="content-grid" id="sermons-list" style="grid-template-columns: 1fr; gap: var(--sp-2);">
          <!-- Populated by JS -->
        </div>

        <!-- Pagination Container -->
        <div class="pagination" id="pagination-container">
          <!-- Populated by JS -->
        </div>

      </div>
    </section>

    <!-- AdSense Placeholder -->
    <section class="section-sm">
      <div class="container">
        <div class="footer-adsense" style="margin: 0 auto; max-width: 728px;">
          Reserved for Google AdSense — Responsive Ad Unit
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- Scripts -->
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=221"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=221"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=221"></script>

  <!-- JSZip & FileSaver for Bulk Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js?v=221"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js?v=221"></script>

  <!-- App Configuration & Services -->
  <script src="assets/js/firebase-config.js?v=221"></script>
  <script src="assets/js/theme.js?v=221"></script>
  <script src="assets/js/data.js?v=221"></script>
  <script src="assets/js/auth.js?v=221"></script>
  <script src="assets/js/db-service.js?v=221"></script>
  <script src="assets/js/save-service.js?v=221"></script>
  <script src="assets/js/components.js?v=221"></script>
  <script src="assets/js/documents.js?v=221"></script>
  <script src="assets/js/search.js?v=221"></script>
  <script src="assets/js/app.js?v=221"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('documents');
      renderFooter();
    });
  </script>
</body>
</html>
