<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hla Lyrics — KṬP Saikhamakawn</title>
  <meta name="description" content="Access and download church newsletters, announcements, meeting minutes, annual reports, and other publications of KṬP Saikhamakawn.">
  <meta name="keywords" content="Hla Lyrics, KTP Saikhamakawn newsletter, Mizo church documents, minutes">

  <!-- Open Graph -->
  <meta property="og:title" content="Hla Lyrics — KṬP Saikhamakawn">
  <meta property="og:description" content="Access and download church newsletters and publications.">
  <meta property="og:image" content="assets/images/logo.png">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <!-- Preconnect for Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css?v=100">
  <link rel="stylesheet" href="assets/css/base.css?v=100">
  <link rel="stylesheet" href="assets/css/mizo-patterns.css?v=100">
  <link rel="stylesheet" href="assets/css/animations.css?v=100">
  <link rel="stylesheet" href="assets/css/components.css?v=100">
  <link rel="stylesheet" href="assets/css/layout.css?v=100">
  <link rel="stylesheet" href="assets/css/pages.css?v=100">
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="site-header"></header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Page Header -->
    <section class="page-title-section mizo-pattern-subtle" style="padding: var(--sp-3) 0 var(--sp-2) 0;">
      <div class="container">
        <h1 class="reveal" style="font-size: clamp(1.75rem, 4vw, 2.5rem); margin-bottom: 0;">🎵 Hla Lyrics</h1>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="section-sm" style="padding-top: var(--sp-2); padding-bottom: var(--sp-2);">
      <div class="container">
        <div style="display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3);">
          
          <!-- Search input -->
          <div style="display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; justify-content: space-between;">
            <div class="search-container" style="width: 100%; max-width: 100%;">
              <span class="search-icon">🔍</span>
              <input type="text" id="doc-search" class="search-input" placeholder="Search lyrics by title...">
              <span class="search-clear" id="search-clear-btn" role="button" aria-label="Clear search">&times;</span>
            </div>
          </div>

          <!-- Alphabet Filter -->
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);">
            <label for="alphabet-select" style="font-size: var(--fs-sm); color: var(--color-text-secondary); font-weight: var(--fw-medium);">Alphabet Filter:</label>
            <select id="alphabet-select" class="filter-select" style="flex: 1; min-width: 150px; max-width: 100%;">
              <!-- Populated by JS -->
            </select>
          </div>

          <!-- Selection Toolbar for Bulk Download -->
          <div id="selection-toolbar" class="floating-selection-toolbar" style="display: none;">
            <div style="display: flex; align-items: center; gap: var(--sp-3);">
              <label style="display: flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-medium);">
                <input type="checkbox" id="select-all-cb" style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand-sky);">
                Select All
              </label>
              <span id="selected-count" style="font-size: var(--fs-xs); color: var(--brand-sky); background: rgba(56, 189, 248, 0.15); padding: 2px 8px; border-radius: 12px; font-weight: var(--fw-bold);">0</span>
            </div>
            <div style="display: flex; gap: var(--sp-1); align-items: center;">
              <button id="btn-bulk-save" class="btn-icon" disabled title="Save Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
              <button id="btn-bulk-download" class="btn-icon" disabled title="Download Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>
            </div>
          </div>

          <!-- Results count/info -->
          <div class="results-info" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--sp-3); border-bottom: 1px solid var(--color-border); padding-bottom: var(--sp-3); margin-bottom: var(--sp-2);">
            <span class="results-count" id="doc-count">Loading lyrics...</span>
            <div style="display: flex; align-items: center; gap: var(--sp-2); max-width: 100%;">
              <label for="lyric-sort" style="font-size: var(--fs-xs); color: var(--color-text-secondary); font-weight: var(--fw-medium);">Sort:</label>
              <select id="lyric-sort" class="filter-select" style="max-width: 180px; text-overflow: ellipsis;">
                <option value="a-z" selected>Mizo Alphabetical (A-Z)</option>
                <option value="z-a">Mizo Alphabetical (Z-A)</option>
                <option value="manual">Manual Order</option>
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
              </select>
            </div>
          </div>

        </div>

        <!-- Documents List (1-column on mobile, 2-column or 3-column styled as a stack) -->
        <div class="content-grid" id="lyrics-list" style="grid-template-columns: 1fr;">
          <!-- Populated by JS -->
        </div>

        <!-- Pagination Container -->
        <div class="pagination" id="pagination-container">
          <!-- Populated by JS -->
        </div>

      </div>
    </section>

    <!-- AdSense Placeholder -->
    <section class="section-sm">
      <div class="container">
        <div class="footer-adsense" style="margin: 0 auto; max-width: 728px;">
          Reserved for Google AdSense — Responsive Ad Unit
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- Scripts -->
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=100"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=100"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=100"></script>

  <!-- JSZip & FileSaver for Bulk Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js?v=100"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js?v=100"></script>

  <!-- App Configuration & Services -->
  <script src="assets/js/firebase-config.js?v=100"></script>
  <script src="assets/js/theme.js?v=100"></script>
  <script src="assets/js/data.js?v=100"></script>
  <script src="assets/js/auth.js?v=100"></script>
  <script src="assets/js/db-service.js?v=100"></script>
  <script src="assets/js/components.js?v=100"></script>
  <script src="assets/js/search.js?v=100"></script>
  <script src="assets/js/lyrics.js?v=100"></script>
  <script src="assets/js/app.js?v=100"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('hla-lyrics');
      renderFooter();
    });
  </script>
</body>
</html>
