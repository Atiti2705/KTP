<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Contact Info Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css?v=107">
  <link rel="stylesheet" href="../assets/css/base.css?v=107">
  <link rel="stylesheet" href="../assets/css/components.css?v=107">
  <link rel="stylesheet" href="../assets/css/admin.css?v=107">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside id="admin-sidebar"></aside>

    <!-- Main Content Panel -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="admin-page-title">Contact Directory</h1>
            <p class="admin-page-desc">Manage contact details for Branch OB, Groups, and Sub-Committees</p>
          </div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: center;">
          <button class="btn btn-outline" id="btn-bulk-delete" style="color: var(--brand-red); border-color: var(--brand-red); display: none;">🗑️ Delete Selected</button>
          <button class="btn btn-primary" id="btn-add-contact">➕ Add Entry</button>
        </div>
      </div>

      <div class="data-table-wrapper" style="margin-top: var(--sp-6); margin-bottom: var(--sp-4); padding: var(--sp-4);">
        <div style="display: flex; gap: var(--sp-3); align-items: center;">
          <label for="admin-filter-type" style="font-size: var(--fs-sm); font-weight: var(--fw-medium);">Filter by Type:</label>
          <select id="admin-filter-type" class="filter-select">
            <option value="All">All Types</option>
            <option value="branch_ob">Branch OB</option>
            <option value="group">Group</option>
            <option value="committee">Sub-Committee</option>
          </select>
        </div>
      </div>

      <div class="data-table-wrapper">
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="select-all-checkbox" style="cursor: pointer; width: 16px; height: 16px;"></th>
                <th style="width: 40px; text-align: center;" title="Drag to reorder">↕️</th>
                <th>Type</th>
                <th>Name</th>
                <th>Primary Contact</th>
                <th>Secondary Contact</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody id="contact-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit/Add Modal -->
  <div class="modal-backdrop" id="contact-form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-form-title">Add Entry</h3>
        <button class="modal-close" id="close-contact-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="contact-crud-form">
        <input type="hidden" id="contact-action-type" value="add">
        <input type="hidden" id="contact-edit-id" value="">

        <div class="modal-body">
          <div class="form-group">
            <label for="contact-type" class="form-label">Type</label>
            <select id="contact-type" class="form-input form-select" required>
              <option value="" disabled selected>Select type...</option>
              <option value="branch_ob">Branch OB</option>
              <option value="group">Group</option>
              <option value="committee">Sub-Committee</option>
            </select>
          </div>

          <!-- Dynamic fields depending on type -->
          <div id="fields-branch-ob" style="display: none;">
            <div class="form-group">
              <label for="ob-name" class="form-label">Name</label>
              <input type="text" id="ob-name" class="form-input">
            </div>
            <div class="form-group">
              <label for="ob-role" class="form-label">Role</label>
              <input type="text" id="ob-role" class="form-input">
            </div>
            <div class="form-group">
              <label for="ob-contact" class="form-label">Contact Number / Email</label>
              <input type="text" id="ob-contact" class="form-input">
            </div>
          </div>

          <div id="fields-group-committee" style="display: none;">
            <div class="form-group">
              <label for="gc-name" class="form-label">Name (Group / Committee)</label>
              <input type="text" id="gc-name" class="form-input">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label for="gc-leader-name" class="form-label" id="label-leader">Leader / Chairman Name</label>
                <input type="text" id="gc-leader-name" class="form-input">
              </div>
              <div class="form-group">
                <label for="gc-leader-contact" class="form-label">Contact</label>
                <input type="text" id="gc-leader-contact" class="form-input">
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label for="gc-sec-name" class="form-label">Secretary Name</label>
                <input type="text" id="gc-sec-name" class="form-input">
              </div>
              <div class="form-group">
                <label for="gc-sec-contact" class="form-label">Contact</label>
                <input type="text" id="gc-sec-contact" class="form-input">
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">💾 Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js?v=107"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=107"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=107"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=107"></script>

  <script src="../assets/js/firebase-config.js?v=107"></script>
  <script src="../assets/js/theme.js?v=107"></script>
  <script src="../assets/js/data.js?v=107"></script>
  <script src="../assets/js/auth.js?v=107"></script>
  <script src="../assets/js/db-service.js?v=107"></script>
  <script src="../assets/js/components.js?v=107"></script>
  <script src="../assets/js/admin.js?v=107"></script>

  <script>
    let currentTypeFilter = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Toast !== 'undefined') Toast.init();
      renderContactTable();
      setupEvents();
      initSortable();
    });

    const typeSelect = document.getElementById('contact-type');
    typeSelect.addEventListener('change', () => {
      const type = typeSelect.value;
      if (type === 'branch_ob') {
        document.getElementById('fields-branch-ob').style.display = 'block';
        document.getElementById('fields-group-committee').style.display = 'none';
      } else {
        document.getElementById('fields-branch-ob').style.display = 'none';
        document.getElementById('fields-group-committee').style.display = 'block';
        document.getElementById('label-leader').textContent = type === 'group' ? 'Leader Name' : 'Chairman Name';
      }
    });

    function formatTypeName(type) {
      if (type === 'branch_ob') return 'Branch OB';
      if (type === 'group') return 'Group';
      if (type === 'committee') return 'Sub-Committee';
      return type;
    }

    function renderContactTable() {
      const tbody = document.getElementById('contact-table-body');
      if (!tbody) return;

      const items = AdminData.get('contact_directory') || [];
      let filtered = items;
      if (currentTypeFilter !== 'All') {
        filtered = items.filter(i => i.type === currentTypeFilter);
      }
      filtered.sort((a, b) => {
        const idxA = typeof a.orderIndex === 'number' ? a.orderIndex : 999999;
        const idxB = typeof b.orderIndex === 'number' ? b.orderIndex : 999999;
        return idxA - idxB;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No entries found</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map((item, index) => {
        let name = '';
        let primary = '';
        let secondary = '';

        if (item.type === 'branch_ob') {
          name = item.name;
          primary = `${item.role} - ${item.contact}`;
        } else {
          name = item.name;
          primary = `Leader/Chair: ${item.leaderName} (${item.leaderContact})`;
          secondary = `Secy: ${item.secretaryName} (${item.secretaryContact})`;
        }

        return `
          <tr data-id="${item.id}" class="sortable-row">
            <td style="text-align: center;"><input type="checkbox" class="row-checkbox" value="${item.id}" style="cursor: pointer; width: 16px; height: 16px;"></td>
            <td class="drag-handle" style="text-align: center; cursor: grab; color: var(--color-text-tertiary);" title="Drag to reorder">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </td>
            <td><span class="badge badge-primary">${formatTypeName(item.type)}</span></td>
            <td style="font-weight: 500;">${name}</td>
            <td>${primary}</td>
            <td>${secondary}</td>
            <td>
              <div style="display:flex; gap:4px;">
                <button class="btn btn-outline btn-sm" onclick="editContact('${item.id}')" style="padding:4px 8px; font-size:12px;" title="Edit">✏️</button>
                <button class="btn btn-outline btn-sm" onclick="confirmDeleteContact('${item.id}')" style="padding:4px 8px; font-size:12px; color:var(--brand-red);" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function initSortable() {
      const tbody = document.getElementById('contact-table-body');
      if (typeof Sortable === 'undefined' || !tbody) return;

      new Sortable(tbody, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: async function (evt) {
          const rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
          const newOrderIds = rows.map(row => row.getAttribute('data-id'));
          try {
            await AdminData.reorder('contact_directory', newOrderIds);
            AdminToast.show('Content reordered successfully!', 'success');
          } catch (e) {
            console.error("Reorder failed:", e);
            AdminToast.show('Failed to save new order.', 'error');
            renderContactTable(); // Revert
          }
        }
      });
    }

    function setupEvents() {
      document.getElementById('admin-filter-type').addEventListener('change', (e) => {
        currentTypeFilter = e.target.value;
        renderContactTable();
      });

      const selectAllCheckbox = document.getElementById('select-all-checkbox');
      const btnBulkDelete = document.getElementById('btn-bulk-delete');

      document.getElementById('contact-table-body').addEventListener('change', (e) => {
        if (e.target.classList.contains('row-checkbox')) {
          const anyChecked = document.querySelectorAll('.row-checkbox:checked').length > 0;
          btnBulkDelete.style.display = anyChecked ? 'inline-flex' : 'none';
          
          const allCheckboxes = document.querySelectorAll('.row-checkbox');
          const allChecked = Array.from(allCheckboxes).every(c => c.checked);
          selectAllCheckbox.checked = allChecked && allCheckboxes.length > 0;
        }
      });

      selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.row-checkbox');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
        btnBulkDelete.style.display = e.target.checked && checkboxes.length > 0 ? 'inline-flex' : 'none';
      });

      btnBulkDelete.addEventListener('click', async () => {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return;
        if (confirm(`Are you sure you want to delete ${checkedBoxes.length} items?`)) {
          btnBulkDelete.disabled = true;
          try {
            for (let cb of checkedBoxes) {
              await AdminData.delete('contact_directory', cb.value);
            }
            AdminToast.show('Selected items deleted.', 'info');
            renderContactTable();
            selectAllCheckbox.checked = false;
            btnBulkDelete.style.display = 'none';
          } catch (err) {
            console.error("Error deleting items:", err);
            AdminToast.show('Error deleting some items.', 'error');
          }
          btnBulkDelete.disabled = false;
        }
      });

      document.getElementById('btn-add-contact').addEventListener('click', () => {
        document.getElementById('contact-crud-form').reset();
        document.getElementById('contact-action-type').value = 'add';
        document.getElementById('modal-form-title').textContent = 'Add Entry';
        typeSelect.dispatchEvent(new Event('change'));
        ModalSystem.open('contact-form-modal');
      });

      const closeModal = () => ModalSystem.close('contact-form-modal');
      document.getElementById('close-contact-modal').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

      document.getElementById('contact-crud-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const actionType = document.getElementById('contact-action-type').value;
        const editId = document.getElementById('contact-edit-id').value;
        const type = document.getElementById('contact-type').value;

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;"></span> Saving...';

        try {
          const itemData = { type };
          
          if (type === 'branch_ob') {
            itemData.name = document.getElementById('ob-name').value;
            itemData.role = document.getElementById('ob-role').value;
            itemData.contact = document.getElementById('ob-contact').value;
          } else {
            itemData.name = document.getElementById('gc-name').value;
            itemData.leaderName = document.getElementById('gc-leader-name').value;
            itemData.leaderContact = document.getElementById('gc-leader-contact').value;
            itemData.secretaryName = document.getElementById('gc-sec-name').value;
            itemData.secretaryContact = document.getElementById('gc-sec-contact').value;
          }

          if (actionType === 'add') {
            await AdminData.add('contact_directory', itemData);
            AdminToast.show('Entry saved successfully!', 'success');
          } else {
            await AdminData.update('contact_directory', editId, itemData);
            AdminToast.show('Entry updated successfully!', 'success');
          }

          closeModal();
          renderContactTable();
        } catch (err) {
          console.error("Error saving entry:", err);
          AdminToast.show('Error saving entry.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '💾 Save Entry';
        }
      });
    }

    window.editContact = function(id) {
      const items = AdminData.get('contact_directory');
      const item = items.find(a => a.id === id);
      if (!item) return;

      document.getElementById('contact-action-type').value = 'edit';
      document.getElementById('contact-edit-id').value = id;
      document.getElementById('modal-form-title').textContent = 'Edit Entry';

      document.getElementById('contact-type').value = item.type;
      typeSelect.dispatchEvent(new Event('change'));

      if (item.type === 'branch_ob') {
        document.getElementById('ob-name').value = item.name || '';
        document.getElementById('ob-role').value = item.role || '';
        document.getElementById('ob-contact').value = item.contact || '';
      } else {
        document.getElementById('gc-name').value = item.name || '';
        document.getElementById('gc-leader-name').value = item.leaderName || '';
        document.getElementById('gc-leader-contact').value = item.leaderContact || '';
        document.getElementById('gc-sec-name').value = item.secretaryName || '';
        document.getElementById('gc-sec-contact').value = item.secretaryContact || '';
      }

      ModalSystem.open('contact-form-modal');
    };

    window.confirmDeleteContact = async function (id) {
      if (confirm(`Are you sure you want to delete this entry?`)) {
        try {
          await AdminData.delete('contact_directory', id);
          AdminToast.show('Entry deleted.', 'info');
          renderContactTable();
        } catch (err) {
          console.error("Error deleting entry:", err);
          AdminToast.show('Error deleting entry.', 'error');
        }
      }
    };
  </script>
</body>
</html>
