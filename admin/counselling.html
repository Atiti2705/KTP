<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Counselling — KṬP Saikhamakawn</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css?v=111">
  <link rel="stylesheet" href="../assets/css/base.css?v=111">
  <link rel="stylesheet" href="../assets/css/components.css?v=111">
  <link rel="stylesheet" href="../assets/css/admin.css?v=111">
  <style>
    .qa-admin-card {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      margin-bottom: var(--sp-4);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .qa-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--sp-2);
      font-size: var(--fs-sm);
      color: var(--color-text-secondary);
    }
    .qa-question {
      font-weight: 600;
      margin-bottom: var(--sp-2);
      font-size: 1.1rem;
    }
    .qa-answer {
      background: var(--color-bg);
      padding: var(--sp-3);
      border-radius: var(--radius-sm);
      margin-bottom: var(--sp-3);
      border-left: 3px solid var(--brand-green);
    }
    .nav-tabs {
      display: flex;
      gap: var(--sp-4);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--sp-4);
    }
    .nav-tab {
      padding: var(--sp-2) var(--sp-4);
      cursor: pointer;
      font-weight: 600;
      color: var(--color-text-secondary);
      border-bottom: 3px solid transparent;
    }
    .nav-tab.active {
      color: var(--brand-sky);
      border-bottom-color: var(--brand-sky);
    }
  </style>
</head>

<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside id="admin-sidebar"></aside>

    <!-- Main Content Panel -->
    <main class="admin-main">

      <!-- Topbar -->
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="admin-page-title">Counselling Q&A</h1>
            <p class="admin-page-desc">Answer anonymous questions from the public</p>
          </div>
        </div>
      </div>

      <div class="data-table-wrapper" style="padding: var(--sp-4);">
        <div class="nav-tabs">
          <div class="nav-tab active" data-tab="unanswered">Unanswered <span class="badge" id="badge-unanswered" style="background:var(--brand-red);color:#fff;">0</span></div>
          <div class="nav-tab" data-tab="answered">Answered <span class="badge" id="badge-answered">0</span></div>
        </div>
        
        <div id="counselling-list">
          <!-- Populated by JS -->
          Loading...
        </div>
      </div>

    </main>
  </div>

  <!-- Reply Modal -->
  <div class="modal-backdrop" id="reply-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Answer Question</h3>
        <button class="modal-close" id="close-reply-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="reply-form">
        <input type="hidden" id="reply-id">
        <div class="modal-body">
          <div style="background: var(--color-bg); padding: var(--sp-3); border-radius: var(--radius-sm); margin-bottom: var(--sp-4); font-style: italic;">
            <strong style="font-style: normal; display: block; margin-bottom: 4px;">Question:</strong>
            <span id="modal-question-text"></span>
          </div>
          
          <div class="form-group">
            <label for="reply-answer" class="form-label">Your Answer</label>
            <textarea id="reply-answer" class="form-input" rows="6" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-reply">💾 Save Answer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=111"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=111"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=111"></script>

  <script src="../assets/js/firebase-config.js?v=111"></script>
  <script src="../assets/js/theme.js?v=111"></script>
  <script src="../assets/js/data.js?v=111"></script>
  <script src="../assets/js/auth.js?v=111"></script>
  <script src="../assets/js/db-service.js?v=111"></script>
  <script src="../assets/js/components.js?v=111"></script>
  <script src="../assets/js/admin.js?v=111"></script>

  <script>
    let currentTab = 'unanswered';
    let qaData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof Toast !== 'undefined') Toast.init();

      // Setup tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.dataset.tab;
          renderList();
        });
      });
      
      // Setup Modals
      document.getElementById('close-reply-modal').addEventListener('click', () => ModalSystem.close('reply-modal'));
      document.getElementById('btn-cancel-modal').addEventListener('click', () => ModalSystem.close('reply-modal'));
      
      document.getElementById('reply-form').addEventListener('submit', handleReplySubmit);

      // Load data
      await loadData();
    });

    async function loadData() {
      try {
        const data = await DbService.get('counselling');
        qaData = data || [];
        
        // Cache it for admin side syncing
        localStorage.setItem('db_counselling', JSON.stringify(qaData));
        
        updateBadges();
        renderList();
      } catch (err) {
        console.error(err);
        AdminToast.show('Failed to load counselling data.', 'error');
      }
    }

    function updateBadges() {
      const unanswered = qaData.filter(d => d.status === 'unanswered');
      const answered = qaData.filter(d => d.status === 'answered');
      document.getElementById('badge-unanswered').textContent = unanswered.length;
      document.getElementById('badge-answered').textContent = answered.length;
    }

    function renderList() {
      const container = document.getElementById('counselling-list');
      const filtered = qaData.filter(d => d.status === currentTab).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      
      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--color-text-secondary);">No ${currentTab} questions.</div>`;
        return;
      }
      
      container.innerHTML = filtered.map(item => `
        <div class="qa-admin-card" style="padding: 0; overflow: hidden; border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-bottom: var(--sp-5);">
          <!-- Post Section (Question) -->
          <div style="padding: var(--sp-4);">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: var(--sp-3);">
              <div style="width: 42px; height: 42px; border-radius: 50%; background: rgba(14,165,233,0.1); color: var(--brand-sky); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                👤
              </div>
              <div>
                <div style="font-weight: 600; color: var(--color-text);">Anonymous User</div>
                <div style="font-size: 0.8rem; color: var(--color-text-tertiary);">${new Date(item.createdAt).toLocaleString()}</div>
              </div>
            </div>
            <div style="font-size: 1.05rem; color: var(--color-text); line-height: 1.6; white-space: pre-wrap; margin-left: 54px; word-break: break-word; overflow-wrap: break-word;">${escapeHTML(item.question)}</div>
          </div>
          
          <!-- Reply Section (Answer) -->
          <div style="background: rgba(0,0,0,0.1); padding: var(--sp-4); border-top: 1px solid var(--color-border);">
            ${item.status === 'answered' ? `
              <div style="display: flex; gap: 12px; margin-bottom: var(--sp-4);">
                <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(16,185,129,0.15); color: var(--brand-green); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0;">
                  ✓
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;">
                    <span style="font-weight: 600; color: var(--brand-green);">Admin Reply</span>
                    <span style="font-size: 0.75rem; color: var(--color-text-tertiary);">${new Date(item.answeredAt).toLocaleString()}</span>
                  </div>
                  <div style="font-size: 0.95rem; color: var(--color-text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;">${escapeHTML(item.answer)}</div>
                </div>
              </div>
            ` : `
              <div style="margin-left: 44px; color: var(--color-text-tertiary); font-size: 0.9rem; font-style: italic; margin-bottom: var(--sp-3);">
                ⏳ No answer provided yet.
              </div>
            `}
            
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: var(--sp-2);">
              <button class="btn btn-sm ${item.status === 'unanswered' ? 'btn-primary' : 'btn-outline'}" onclick="openReplyModal('${item.id}')" style="padding: 6px 16px;">
                ${item.status === 'unanswered' ? '✍️ Answer' : '✏️ Edit Answer'}
              </button>
              <button class="btn btn-sm btn-outline" style="color:var(--brand-red); border-color:rgba(239,68,68,0.3); padding: 6px 16px;" onclick="deleteQuestion('${item.id}')">
                🗑️ Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openReplyModal(id) {
      const item = qaData.find(d => d.id === id);
      if (!item) return;
      
      document.getElementById('reply-id').value = id;
      document.getElementById('modal-question-text').textContent = item.question;
      document.getElementById('reply-answer').value = item.answer || '';
      
      ModalSystem.open('reply-modal');
    }

    async function handleReplySubmit(e) {
      e.preventDefault();
      const id = document.getElementById('reply-id').value;
      const answer = document.getElementById('reply-answer').value;
      const item = qaData.find(d => d.id === id);
      const btn = document.getElementById('btn-submit-reply');
      
      try {
        btn.disabled = true;
        btn.innerHTML = 'Saving... ⏳';
        
        await DbService.update('counselling', id, {
          answer,
          status: 'answered',
          answeredAt: new Date().toISOString()
        });
        
        AdminToast.show('Answer saved successfully!', 'success');
        ModalSystem.close('reply-modal');
        await loadData();
      } catch (err) {
        console.error(err);
        AdminToast.show('Error saving answer.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '💾 Save Answer';
      }
    }

    async function deleteQuestion(id) {
      if (confirm('Are you sure you want to delete this question? This cannot be undone.')) {
        try {
          await DbService.delete('counselling', id);
          AdminToast.show('Question deleted.', 'success');
          await loadData();
        } catch (err) {
          console.error(err);
          AdminToast.show('Error deleting question.', 'error');
        }
      }
    }
    
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
