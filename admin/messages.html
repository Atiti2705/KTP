<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css?v=117">
  <link rel="stylesheet" href="../assets/css/base.css?v=117">
  <link rel="stylesheet" href="../assets/css/components.css?v=117">
  <link rel="stylesheet" href="../assets/css/admin.css?v=117">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside id="admin-sidebar"></aside>

    <!-- Main Content Panel -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="admin-page-title">Inbox Messages</h1>
            <p class="admin-page-desc">View messages submitted via the Contact page</p>
          </div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: center;">
          <button class="btn btn-outline" id="btn-bulk-delete" style="color: var(--brand-red); border-color: var(--brand-red); display: none;">🗑️ Delete Selected</button>
          <button class="btn btn-outline" id="btn-refresh" style="display:flex;align-items:center;gap:4px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            Refresh
          </button>
        </div>
      </div>

      <div class="data-table-wrapper" style="margin-top: var(--sp-6);">
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="select-all-checkbox" style="cursor: pointer; width: 16px; height: 16px;"></th>
                <th style="width: 150px;">Date</th>
                <th>Sender Name</th>
                <th>Sender Email</th>
                <th style="width: 40%;">Message</th>
                <th style="width: 60px;">Actions</th>
              </tr>
            </thead>
            <tbody id="messages-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=117"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=117"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=117"></script>

  <script src="../assets/js/firebase-config.js?v=117"></script>
  <script src="../assets/js/theme.js?v=117"></script>
  <script src="../assets/js/data.js?v=117"></script>
  <script src="../assets/js/auth.js?v=117"></script>
  <script src="../assets/js/db-service.js?v=117"></script>
  <script src="../assets/js/components.js?v=117"></script>
  <script src="../assets/js/admin.js?v=117"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Toast !== 'undefined') Toast.init();
      renderMessagesTable();
      setupEvents();
    });

    async function fetchMessages() {
      if (!FirebaseConfig.db) return [];
      try {
        const snapshot = await FirebaseConfig.db.collection('messages').orderBy('timestamp', 'desc').get();
        const items = [];
        snapshot.forEach(doc => {
          items.push({ id: doc.id, ...doc.data() });
        });
        return items;
      } catch (err) {
        console.error("Error fetching messages", err);
        return [];
      }
    }

    async function renderMessagesTable() {
      const tbody = document.getElementById('messages-table-body');
      if (!tbody) return;

      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Loading messages...</td></tr>';
      
      const items = await fetchMessages();

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Inbox is empty</td></tr>';
        return;
      }

      tbody.innerHTML = items.map((item) => {
        let dateStr = 'Unknown';
        if (item.timestamp) {
          try {
            const dateObj = item.timestamp.toDate ? item.timestamp.toDate() : new Date(item.timestamp);
            dateStr = dateObj.toLocaleString();
          } catch(e) {}
        }

        return `
          <tr data-id="${item.id}">
            <td style="text-align: center;"><input type="checkbox" class="row-checkbox" value="${item.id}" style="cursor: pointer; width: 16px; height: 16px;"></td>
            <td style="font-size: 0.85rem; color: var(--color-text-secondary);">${dateStr}</td>
            <td style="font-weight: 500;">${item.name || 'Anonymous'}</td>
            <td><a href="mailto:${item.email}" style="color: var(--brand-sky); text-decoration: none;">${item.email || '-'}</a></td>
            <td style="white-space: pre-wrap; word-break: break-word;">${item.message || ''}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="confirmDeleteMessage('${item.id}')" style="padding:4px 8px; font-size:12px; color:var(--brand-red);" title="Delete">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function setupEvents() {
      const selectAllCheckbox = document.getElementById('select-all-checkbox');
      const btnBulkDelete = document.getElementById('btn-bulk-delete');
      const btnRefresh = document.getElementById('btn-refresh');

      btnRefresh.addEventListener('click', () => {
        renderMessagesTable();
        AdminToast.show('Inbox refreshed', 'info');
      });

      document.getElementById('messages-table-body').addEventListener('change', (e) => {
        if (e.target.classList.contains('row-checkbox')) {
          const anyChecked = document.querySelectorAll('.row-checkbox:checked').length > 0;
          btnBulkDelete.style.display = anyChecked ? 'inline-flex' : 'none';
          
          const allCheckboxes = document.querySelectorAll('.row-checkbox');
          const allChecked = Array.from(allCheckboxes).every(c => c.checked);
          selectAllCheckbox.checked = allChecked && allCheckboxes.length > 0;
        }
      });

      selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.row-checkbox');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
        btnBulkDelete.style.display = e.target.checked && checkboxes.length > 0 ? 'inline-flex' : 'none';
      });

      btnBulkDelete.addEventListener('click', async () => {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return;
        if (confirm(`Are you sure you want to delete ${checkedBoxes.length} messages?`)) {
          btnBulkDelete.disabled = true;
          try {
            for (let cb of checkedBoxes) {
              await FirebaseConfig.db.collection('messages').doc(cb.value).delete();
            }
            AdminToast.show('Selected messages deleted.', 'info');
            renderMessagesTable();
            selectAllCheckbox.checked = false;
            btnBulkDelete.style.display = 'none';
          } catch (err) {
            console.error("Error deleting messages:", err);
            AdminToast.show('Error deleting some messages.', 'error');
          }
          btnBulkDelete.disabled = false;
        }
      });
    }

    window.confirmDeleteMessage = async function (id) {
      if (confirm(`Are you sure you want to delete this message?`)) {
        try {
          await FirebaseConfig.db.collection('messages').doc(id).delete();
          AdminToast.show('Message deleted.', 'info');
          renderMessagesTable();
        } catch (err) {
          console.error("Error deleting message:", err);
          AdminToast.show('Error deleting message.', 'error');
        }
      }
    };
  </script>
</body>
</html>
