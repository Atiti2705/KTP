<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage About Us — KṬP Saikhamakawn</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css?v=103">
  <link rel="stylesheet" href="../assets/css/base.css?v=103">
  <link rel="stylesheet" href="../assets/css/components.css?v=103">
  <link rel="stylesheet" href="../assets/css/admin.css?v=103">
</head>

<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside id="admin-sidebar"></aside>

    <!-- Main Content Panel -->
    <main class="admin-main">

      <!-- Topbar -->
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="admin-page-title">About Us Manager</h1>
            <p class="admin-page-desc">Manage text blocks and photos for the About Us section</p>
          </div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: center;">
          <button class="btn btn-outline" id="btn-bulk-delete" style="color: var(--brand-red); border-color: var(--brand-red); display: none;">🗑️ Delete Selected</button>
          <button class="btn btn-primary" id="btn-add-about">➕ Add Block</button>
        </div>
      </div>

      <!-- Data Table -->
      <div class="data-table-wrapper" style="margin-top: var(--sp-6);">
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="select-all-checkbox" style="cursor: pointer; width: 16px; height: 16px;"></th>
                <th style="width: 40px; text-align: center;" title="Drag to reorder">↕️</th>
                <th>Title</th>
                <th>Content Snippet</th>
                <th>Images</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody id="about-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Edit/Add Modal -->
  <div class="modal-backdrop" id="about-form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-form-title">Add Content Block</h3>
        <button class="modal-close" id="close-about-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="about-crud-form">
        <input type="hidden" id="about-action-type" value="add">
        <input type="hidden" id="about-edit-id" value="">

        <div class="modal-body">
          <div class="form-group">
            <label for="about-title" class="form-label">Title (e.g. MIZORAM SYNOD CHOIR HLANNA)</label>
            <input type="text" id="about-title" class="form-input" required placeholder="Enter title">
          </div>

          <div class="form-group">
            <label for="about-date" class="form-label">Date or Subtitle (e.g. May 6, 2026 or about a month ago)</label>
            <input type="text" id="about-date" class="form-input" placeholder="e.g. May 6, 2026">
          </div>

          <div class="form-group">
            <label for="about-content" class="form-label">Text Content</label>
            <textarea id="about-content" class="form-input form-textarea" required
              placeholder="Write the full description here..." style="min-height: 140px;"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="about-images">Image URLs (for slider)</label>
            <textarea class="form-input form-textarea" id="about-images" style="min-height: 80px;" placeholder="Paste Google Drive links for the images, separated by commas.&#10;&#10;IMPORTANT: You must link to INDIVIDUAL photo files. Links to Google Drive folders will NOT work."></textarea>
            <div style="font-size: 0.8rem; color: var(--color-text-tertiary); margin-top: 4px;">
              Make sure each photo is set to <strong>"Anyone with the link"</strong> on Google Drive. To add multiple photos, separate their links with a comma.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">💾 Save Block</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <!-- SortableJS for drag-and-drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js?v=103"></script>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=103"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=103"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=103"></script>

  <!-- App Configuration & Services -->
  <script src="../assets/js/firebase-config.js?v=103"></script>
  <script src="../assets/js/theme.js?v=103"></script>
  <script src="../assets/js/data.js?v=103"></script>
  <script src="../assets/js/auth.js?v=103"></script>
  <script src="../assets/js/db-service.js?v=103"></script>
  <script src="../assets/js/components.js?v=103"></script>
  <script src="../assets/js/admin.js?v=103"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Toast !== 'undefined') Toast.init();

      renderAboutTable();
      setupEvents();
      initSortable();
    });

    function renderAboutTable() {
      const tbody = document.getElementById('about-table-body');
      if (!tbody) return;

      const items = AdminData.get('about');

      if (items.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; color: var(--color-text-secondary); padding: var(--sp-6);">
              No content found.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const contentSnippet = (item.content || '').length > 50 ? `${(item.content || '').substring(0, 50)}...` : (item.content || '<em>No Text</em>');
        const imgCount = (item.imageUrls && item.imageUrls.length) ? item.imageUrls.length : 0;
        const imgDisplay = imgCount > 0 ? `<img src="${item.imageUrls[0]}" style="max-height: 40px; border-radius: 4px;"> <small>(${imgCount})</small>` : '<em>No Image</em>';

        return `
          <tr data-id="${item.id}">
            <td style="text-align: center;">
              <input type="checkbox" class="row-checkbox" value="${item.id}" style="cursor: pointer; width: 16px; height: 16px;">
            </td>
            <td style="text-align: center; cursor: grab; font-size: 20px; color: var(--color-text-tertiary);" class="drag-handle" title="Drag to reorder">☰</td>
            <td style="font-weight: bold; max-width: 200px;">${item.title || 'Untitled'}</td>
            <td style="color:var(--color-text-secondary); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${contentSnippet}</td>
            <td>${imgDisplay}</td>
            <td>
              <div class="table-actions">
                <button class="btn btn-outline btn-sm" onclick="openEditModal('${item.id}')" style="padding:4px 8px; font-size:12px;" title="Edit Block">✏️</button>
                <button class="btn btn-outline btn-sm" onclick="confirmDeleteAbout('${item.id}')" style="padding:4px 8px; font-size:12px; color:var(--brand-red);" title="Delete Block">❌</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.row-checkbox').forEach(cb => {
        cb.addEventListener('change', updateBulkDeleteUI);
      });
      const selectAllCb = document.getElementById('select-all-checkbox');
      if (selectAllCb) selectAllCb.checked = false;
      updateBulkDeleteUI();
    }

    function initSortable() {
      const tbody = document.getElementById('about-table-body');
      if (typeof Sortable === 'undefined' || !tbody) return;

      new Sortable(tbody, {
        animation: 150,
        handle: '.drag-handle',
        onEnd: async function () {
          const rows = tbody.querySelectorAll('tr[data-id]');
          const newOrderIds = Array.from(rows).map(row => row.getAttribute('data-id'));
          
          try {
            await AdminData.reorder('about', newOrderIds);
            AdminToast.show('Content reordered successfully!', 'success');
          } catch (e) {
            console.error(e);
            AdminToast.show('Failed to save new order.', 'error');
            renderAboutTable(); // Revert
          }
        }
      });
    }

    function setupEvents() {
      const selectAllCb = document.getElementById('select-all-checkbox');
      const bulkDeleteBtn = document.getElementById('btn-bulk-delete');

      if (selectAllCb) {
        selectAllCb.addEventListener('change', (e) => {
          const isChecked = e.target.checked;
          document.querySelectorAll('.row-checkbox').forEach(cb => {
            cb.checked = isChecked;
          });
          updateBulkDeleteUI();
        });
      }

      if (bulkDeleteBtn) {
        bulkDeleteBtn.addEventListener('click', async () => {
          const selectedCbs = document.querySelectorAll('.row-checkbox:checked');
          if (selectedCbs.length === 0) return;

          if (confirm(`Are you sure you want to delete the ${selectedCbs.length} selected block(s)? This cannot be undone.`)) {
            try {
              bulkDeleteBtn.disabled = true;
              bulkDeleteBtn.innerHTML = '⌛ Deleting...';
              
              for (const cb of selectedCbs) {
                await AdminData.delete('about', cb.value);
              }
              
              AdminToast.show(`Successfully deleted ${selectedCbs.length} block(s).`, 'success');
              renderAboutTable();
            } catch (err) {
              console.error("Error deleting blocks:", err);
              AdminToast.show('Error during bulk deletion: ' + (err.message || 'Permission denied'), 'error');
            } finally {
              bulkDeleteBtn.disabled = false;
              bulkDeleteBtn.innerHTML = '🗑️ Delete Selected';
              updateBulkDeleteUI();
            }
          }
        });
      }

      document.getElementById('btn-add-about').addEventListener('click', () => {
        document.getElementById('about-crud-form').reset();
        document.getElementById('about-action-type').value = 'add';
        document.getElementById('modal-form-title').textContent = 'Add New Content Block';
        ModalSystem.open('about-form-modal');
      });

      const closeModal = () => ModalSystem.close('about-form-modal');
      document.getElementById('close-about-modal').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

      document.getElementById('about-crud-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const actionType = document.getElementById('about-action-type').value;
        const editId = document.getElementById('about-edit-id').value;

        const title = document.getElementById('about-title').value;
        const date = document.getElementById('about-date').value;
        const content = document.getElementById('about-content').value;

        function formatDriveImageLink(url) {
          if (!url) return '';
          const match = url.trim().match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
          if (match && match[1]) {
            return `https://lh3.googleusercontent.com/d/${match[1]}`;
          }
          return url.trim();
        }

        const rawImagesStr = document.getElementById('about-images').value;
        const imageUrls = rawImagesStr.split(',').map(u => formatDriveImageLink(u)).filter(u => u !== '');

        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '⌛ Saving...';

          if (actionType === 'add') {
            const newItem = {
              title,
              date,
              content,
              imageUrls,
              orderIndex: 999
            };
            await AdminData.add('about', newItem);
            AdminToast.show('Block saved successfully!', 'success');
          } else {
            const updatedFields = {
              title,
              date,
              content,
              imageUrls
            };
            await AdminData.update('about', editId, updatedFields);
            AdminToast.show('Block updated successfully!', 'success');
          }

          closeModal();
          renderAboutTable();
        } catch (err) {
          console.error("Error saving block:", err);
          AdminToast.show('Error saving block: ' + (err.message || 'Permission denied'), 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      });
    }

    function updateBulkDeleteUI() {
      const selectedCount = document.querySelectorAll('.row-checkbox:checked').length;
      const totalCount = document.querySelectorAll('.row-checkbox').length;
      const bulkDeleteBtn = document.getElementById('btn-bulk-delete');
      const selectAllCb = document.getElementById('select-all-checkbox');

      if (bulkDeleteBtn) {
        bulkDeleteBtn.style.display = selectedCount > 0 ? 'inline-block' : 'none';
        bulkDeleteBtn.textContent = `🗑️ Delete Selected (${selectedCount})`;
      }

      if (selectAllCb && totalCount > 0) {
        selectAllCb.checked = selectedCount === totalCount;
        selectAllCb.indeterminate = selectedCount > 0 && selectedCount < totalCount;
      }
    }

    window.openEditModal = function (id) {
      const items = AdminData.get('about');
      const item = items.find(a => a.id === id);
      if (!item) return;

      document.getElementById('about-action-type').value = 'edit';
      document.getElementById('about-edit-id').value = id;
      document.getElementById('modal-form-title').textContent = 'Edit Content Block';

      document.getElementById('about-title').value = item.title || '';
      document.getElementById('about-date').value = item.date || '';
      document.getElementById('about-content').value = item.content || '';
      document.getElementById('about-images').value = (item.imageUrls || []).join(', ');

      ModalSystem.open('about-form-modal');
    };

    window.confirmDeleteAbout = async function (id) {
      if (confirm(`Are you sure you want to delete this block?`)) {
        try {
          await AdminData.delete('about', id);
          AdminToast.show('Block deleted.', 'info');
          renderAboutTable();
        } catch (err) {
          console.error("Error deleting block:", err);
          AdminToast.show('Error deleting block: ' + (err.message || 'Permission denied'), 'error');
        }
      }
    };
  </script>
</body>

</html>
