<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — KṬP Saikhamakawn</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css?v=110">
  <link rel="stylesheet" href="../assets/css/base.css?v=110">
  <link rel="stylesheet" href="../assets/css/components.css?v=110">
  <link rel="stylesheet" href="../assets/css/admin.css?v=110">
</head>
<body class="admin-login-page">

  <div class="login-card">
    <div class="login-header">
      <img src="../assets/images/logo.png" alt="KṬP Saikhamakawn Logo" class="login-logo">
      <h1 class="login-title">KṬP Saikhamakawn</h1>
      <p class="login-subtitle">Control Panel Access</p>
    </div>

    <div class="login-body">
      <!-- Error message container -->
      <div class="login-error" id="login-error">
        <span>❌</span>
        <span>Username or password is incorrect.</span>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: var(--sp-6);">
          <label for="password" class="form-label">Admin Password</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          🔐 Log In
        </button>

        <!-- Divider -->
        <div id="admin-google-divider" style="display: none; align-items: center; gap: var(--sp-3); margin: var(--sp-4) 0; color: var(--color-text-tertiary); font-size: var(--fs-xs);">
          <div style="flex: 1; height: 1px; background: var(--color-border-light);"></div>
          <span>OR</span>
          <div style="flex: 1; height: 1px; background: var(--color-border-light);"></div>
        </div>

        <!-- Google Login -->
        <button type="button" class="btn btn-outline" id="btn-admin-google" style="display: none; width: 100%; justify-content: center; align-items: center; gap: var(--sp-3);">
          <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink: 0;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.62-.62-1.02-1.36-1.19-2.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=110"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=110"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=110"></script>

  <!-- App Configuration & Services -->
  <script src="../assets/js/firebase-config.js?v=110"></script>
  <script src="../assets/js/theme.js?v=110"></script>
  <script src="../assets/js/data.js?v=110"></script>
  <script src="../assets/js/auth.js?v=110"></script>
  <script src="../assets/js/db-service.js?v=110"></script>
  <script src="../assets/js/admin.js?v=110"></script>
</body>
</html>
