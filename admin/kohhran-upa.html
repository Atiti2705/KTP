<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Kohhran Upa — KṬP Saikhamakawn</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css?v=111">
  <link rel="stylesheet" href="../assets/css/base.css?v=111">
  <link rel="stylesheet" href="../assets/css/components.css?v=111">
  <link rel="stylesheet" href="../assets/css/admin.css?v=111">
</head>

<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside id="admin-sidebar"></aside>

    <!-- Main Content Panel -->
    <main class="admin-main">

      <!-- Topbar -->
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="admin-page-title">Kohhran Upa</h1>
            <p class="admin-page-desc">Manage Kohhran Upa entries</p>
          </div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: center;">
          <button class="btn btn-outline" id="btn-bulk-delete" style="color: var(--brand-red); border-color: var(--brand-red); display: none;">🗑️ Delete Selected</button>
          <button class="btn btn-primary" id="btn-add-ob">➕ Add Entry</button>
        </div>
      </div>

      <!-- Data Table -->
      <div class="data-table-wrapper">
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="select-all-checkbox" style="cursor: pointer; width: 16px; height: 16px;"></th>
                <th style="width: 40px; text-align: center;" title="Drag to reorder">↕️</th>
                <th>Category</th>
                <th>Term / Title</th>
                <th>Year Filter</th>
                <th>Text Content</th>
                <th>Photo</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody id="ob-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Edit/Add Modal -->
  <div class="modal-backdrop" id="ob-form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-form-title">Add Entry</h3>
        <button class="modal-close" id="close-ob-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="ob-crud-form">
        <input type="hidden" id="ob-action-type" value="add">
        <input type="hidden" id="ob-edit-id" value="">

        <div class="modal-body">
          <input type="hidden" id="ob-category" value="Kohhran Upa">

          <div class="form-group">
            <label for="ob-title" class="form-label">Name (e.g. Upa Lalremruata)</label>
            <input type="text" id="ob-title" class="form-input" required>
          </div>

          <div class="form-group">
            <label for="ob-year" class="form-label">Year for Filtering (e.g. 2025)</label>
            <select id="ob-year" class="form-input"><option value="">-- Use Title --</option></select>
            <div style="font-size: 0.8rem; color: var(--color-text-tertiary); margin-top: 4px;">
              If left blank, the Title will be used in the filter dropdown.
            </div>
          </div>

          <div class="form-group">
            <label for="ob-content" class="form-label">Role / Description</label>
            <textarea id="ob-content" class="form-input form-textarea" style="min-height: 100px;"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="ob-image">Google Drive Photo Link</label>
            <input type="text" class="form-input" id="ob-image">
            <div style="font-size: 0.8rem; color: var(--color-text-tertiary); margin-top: 4px;">
              Make sure the photo is set to <strong>"Anyone with the link"</strong> on Google Drive.
            </div>
          </div>

          <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
            <input type="checkbox" id="ob-pinned" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="ob-pinned" class="form-label" style="margin: 0; cursor: pointer;">📌 Pin to Homepage News Section</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">💾 Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <!-- SortableJS for drag-and-drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js?v=111"></script>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=111"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=111"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=111"></script>

  <!-- App Configuration & Services -->
  <script src="../assets/js/firebase-config.js?v=111"></script>
  <script src="../assets/js/theme.js?v=111"></script>
  <script src="../assets/js/data.js?v=111"></script>
  <script src="../assets/js/auth.js?v=111"></script>
  <script src="../assets/js/db-service.js?v=111"></script>
  <script src="../assets/js/components.js?v=111"></script>
  <script src="../assets/js/admin.js?v=111"></script>

  <script>
    const targetCollection = 'Kohhran Upa';
    let currentCategoryFilter = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Toast !== 'undefined') Toast.init();

      renderOBTable();
      setupEvents();
      initSortable();
    });

    function formatDriveImageLink(url) {
      if (!url) return '';
      const match = url.trim().match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url.trim();
    }

    function formatCategoryName(cat) {
      const names = {
        'branch-ob': 'Branch OB',
        'branch-committee': 'Branch Committee',
        'group-committee': 'Group Committee',
        'sub-committee': 'Sub Committee',
        'golden-jubilee': 'Golden Jubilee'
      };
      return names[cat] || cat;
    }

    function renderOBTable() {
      const tbody = document.getElementById('ob-table-body');
      if (!tbody) return;

      const items = AdminData.get(targetCollection) || [];
      
      let filtered = items;
      if (currentCategoryFilter !== 'All') {
        filtered = items.filter(i => i.category === currentCategoryFilter);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; color: var(--color-text-secondary); padding: var(--sp-6);">
              No entries found.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const contentSnippet = (item.content || '').length > 50 ? `${(item.content || '').substring(0, 50)}...` : (item.content || '<em>No Text</em>');
        const imgDisplay = item.imageUrl ? `<img src="${formatDriveImageLink(item.imageUrl)}" style="max-height: 40px; border-radius: 4px;">` : '<em>No Image</em>';

        return `
          <tr data-id="${item.id}">
            <td style="text-align: center;">
              <input type="checkbox" class="row-checkbox" value="${item.id}" style="cursor: pointer; width: 16px; height: 16px;">
            </td>
            <td style="text-align: center; cursor: grab; font-size: 20px; color: var(--color-text-tertiary);" class="drag-handle" title="Drag to reorder">☰</td>
            <td><span class="badge badge-primary">${formatCategoryName(item.category)}</span></td>
            <td style="font-weight: bold; max-width: 200px;">
              ${item.title || 'Untitled'}
              ${item.pinnedToHomepage ? '<span class="badge badge-secondary" style="font-size:0.6rem; margin-left:4px;">📌 Pinned</span>' : ''}
            </td>
            <td><span class="badge badge-secondary">${item.year || '-'}</span></td>
            <td style="color:var(--color-text-secondary); max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${contentSnippet}</td>
            <td>${imgDisplay}</td>
            <td>
              <div class="table-actions">
                <button class="btn btn-outline btn-sm" onclick="openEditModal('${item.id}')" style="padding:4px 8px; font-size:12px;" title="Edit">✏️</button>
                <button class="btn btn-outline btn-sm" onclick="confirmDeleteOB('${item.id}')" style="padding:4px 8px; font-size:12px; color:var(--brand-red);" title="Delete">❌</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.row-checkbox').forEach(cb => {
        cb.addEventListener('change', updateBulkDeleteUI);
      });
      const selectAllCb = document.getElementById('select-all-checkbox');
      if (selectAllCb) selectAllCb.checked = false;
      updateBulkDeleteUI();
    }

    function initSortable() {
      const tbody = document.getElementById('ob-table-body');
      if (typeof Sortable === 'undefined' || !tbody) return;

      new Sortable(tbody, {
        animation: 150,
        handle: '.drag-handle',
        onEnd: async function () {
          if (currentCategoryFilter !== 'All') {
            AdminToast.show('Cannot reorder while filtered. Please view All Categories.', 'error');
            renderOBTable(); // Revert
            return;
          }

          const rows = tbody.querySelectorAll('tr[data-id]');
          const newOrderIds = Array.from(rows).map(row => row.getAttribute('data-id'));
          
          try {
            await AdminData.reorder(targetCollection, newOrderIds);
            AdminToast.show('Entries reordered successfully!', 'success');
          } catch (e) {
            console.error(e);
            AdminToast.show('Failed to save new order.', 'error');
            renderOBTable(); // Revert
          }
        }
      });
    }

    function setupEvents() {
      // Filter functionality
      // Filter removed

      const selectAllCb = document.getElementById('select-all-checkbox');
      const bulkDeleteBtn = document.getElementById('btn-bulk-delete');

      if (selectAllCb) {
        selectAllCb.addEventListener('change', (e) => {
          const isChecked = e.target.checked;
          document.querySelectorAll('.row-checkbox').forEach(cb => {
            cb.checked = isChecked;
          });
          updateBulkDeleteUI();
        });
      }

      if (bulkDeleteBtn) {
        bulkDeleteBtn.addEventListener('click', async () => {
          const selectedCbs = document.querySelectorAll('.row-checkbox:checked');
          if (selectedCbs.length === 0) return;

          if (confirm(`Are you sure you want to delete the ${selectedCbs.length} selected entry(s)? This cannot be undone.`)) {
            try {
              bulkDeleteBtn.disabled = true;
              bulkDeleteBtn.innerHTML = '⌛ Deleting...';
              
              for (const cb of selectedCbs) {
                await AdminData.delete(targetCollection, cb.value);
              }
              
              AdminToast.show(`Successfully deleted ${selectedCbs.length} entry(s).`, 'success');
              renderOBTable();
            } catch (err) {
              console.error("Error deleting entries:", err);
              AdminToast.show('Error during bulk deletion: ' + (err.message || 'Permission denied'), 'error');
            } finally {
              bulkDeleteBtn.disabled = false;
              bulkDeleteBtn.innerHTML = '🗑️ Delete Selected';
              updateBulkDeleteUI();
            }
          }
        });
      }

      document.getElementById('btn-add-ob').addEventListener('click', () => {
        document.getElementById('ob-crud-form').reset();
        document.getElementById('ob-action-type').value = 'add';
        document.getElementById('modal-form-title').textContent = 'Add New Entry';
        document.getElementById('ob-pinned').checked = false;
        
        // Auto-select category if filtered
        if (currentCategoryFilter !== 'All') {
          document.getElementById('ob-category').value = currentCategoryFilter;
        }

        ModalSystem.open('ob-form-modal');
      });

      const closeModal = () => ModalSystem.close('ob-form-modal');
      document.getElementById('close-ob-modal').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

      document.getElementById('ob-crud-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const actionType = document.getElementById('ob-action-type').value;
        const editId = document.getElementById('ob-edit-id').value;

        const category = document.getElementById('ob-category').value;
        const title = document.getElementById('ob-title').value;
        const year = document.getElementById('ob-year').value;
        const content = document.getElementById('ob-content').value;
        const imageUrl = document.getElementById('ob-image').value;
        const pinnedToHomepage = document.getElementById('ob-pinned').checked;

        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '⌛ Saving...';

          if (actionType === 'add') {
            const newItem = {
              category,
              title,
              year,
              content,
              imageUrl,
              pinnedToHomepage,
              orderIndex: 999,
              date: new Date().toISOString()
            };
            await AdminData.add(targetCollection, newItem);
            AdminToast.show('Entry saved successfully!', 'success');
          } else {
            const updatedFields = {
              category,
              title,
              year,
              content,
              imageUrl,
              pinnedToHomepage
            };
            await AdminData.update(targetCollection, editId, updatedFields);
            AdminToast.show('Entry updated successfully!', 'success');
          }

          closeModal();
          renderOBTable();
        } catch (err) {
          console.error("Error saving entry:", err);
          AdminToast.show('Error saving entry: ' + (err.message || 'Permission denied'), 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      });
    }

    function updateBulkDeleteUI() {
      const selectedCount = document.querySelectorAll('.row-checkbox:checked').length;
      const totalCount = document.querySelectorAll('.row-checkbox').length;
      const bulkDeleteBtn = document.getElementById('btn-bulk-delete');
      const selectAllCb = document.getElementById('select-all-checkbox');

      if (bulkDeleteBtn) {
        bulkDeleteBtn.style.display = selectedCount > 0 ? 'inline-block' : 'none';
        bulkDeleteBtn.textContent = `🗑️ Delete Selected (${selectedCount})`;
      }

      if (selectAllCb && totalCount > 0) {
        selectAllCb.checked = selectedCount === totalCount;
        selectAllCb.indeterminate = selectedCount > 0 && selectedCount < totalCount;
      }
    }

    window.openEditModal = function (id) {
      const items = AdminData.get(targetCollection);
      const item = items.find(a => a.id === id);
      if (!item) return;

      document.getElementById('ob-action-type').value = 'edit';
      document.getElementById('ob-edit-id').value = id;
      document.getElementById('modal-form-title').textContent = 'Edit Entry';

      document.getElementById('ob-category').value = item.category || '';
      document.getElementById('ob-title').value = item.title || '';
      document.getElementById('ob-year').value = item.year || '';
      document.getElementById('ob-content').value = item.content || '';
      document.getElementById('ob-image').value = item.imageUrl || '';
      document.getElementById('ob-pinned').checked = !!item.pinnedToHomepage;

      ModalSystem.open('ob-form-modal');
    };

    window.confirmDeleteOB = async function (id) {
      if (confirm(`Are you sure you want to delete this entry?`)) {
        try {
          await AdminData.delete(targetCollection, id);
          AdminToast.show('Entry deleted.', 'info');
          renderOBTable();
        } catch (err) {
          console.error("Error deleting entry:", err);
          AdminToast.show('Error deleting entry: ' + (err.message || 'Permission denied'), 'error');
        }
      }
    };
  </script>
</body>

</html>
