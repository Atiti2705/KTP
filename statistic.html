<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics — KṬP Saikhamakawn</title>
  <meta name="description" content="Branch statistics and membership numbers for KṬP Saikhamakawn — Kristian Ṭhalai Pawl.">
  <meta name="keywords" content="KTP Saikhamakawn statistics, members, branch data, Mizo church">
  <meta property="og:title" content="Statistics — KṬP Saikhamakawn">
  <meta property="og:description" content="Branch statistics and membership numbers for KṬP Saikhamakawn.">
  <meta property="og:image" content="assets/images/logo.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/variables.css?v=105">
  <link rel="stylesheet" href="assets/css/base.css?v=105">
  <link rel="stylesheet" href="assets/css/mizo-patterns.css?v=105">
  <link rel="stylesheet" href="assets/css/animations.css?v=105">
  <link rel="stylesheet" href="assets/css/components.css?v=105">
  <link rel="stylesheet" href="assets/css/layout.css?v=105">
  <link rel="stylesheet" href="assets/css/pages.css?v=105">

  <style>
    /* ================================================
       STATISTICS PAGE  — Premium Redesign
       ================================================ */

    /* ─── Entry Card ─────────────────────────────── */
    .stat-entry {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
      overflow: hidden;
      transition: box-shadow .35s ease, transform .35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stat-entry:hover {
      box-shadow: 0 14px 45px rgba(0,0,0,.15), 0 0 20px rgba(14,165,233,.08);
      transform: translateY(-4px);
    }

    /* ─── Header Banner ──────────────────────────── */
    .stat-entry-header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.12) 0%, rgba(14, 165, 233, 0.03) 100%);
      border-bottom: 1px solid var(--color-border-light);
      overflow: hidden;
    }
    .stat-entry-year-bubble {
      position: relative;
      z-index: 1;
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.15);
      border-radius: 14px;
      padding: .5rem 1rem;
      text-align: center;
      flex-shrink: 0;
    }
    .stat-entry-year-text {
      display: block;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--brand-sky), var(--brand-sky-light, #a8d8ea));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-entry-year-label {
      display: block;
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--color-text-secondary);
      margin-top: 2px;
      font-weight: 700;
    }
    .stat-entry-meta {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
    }
    .stat-entry-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 .3rem;
      line-height: 1.3;
    }
    .stat-entry-desc {
      font-size: .85rem;
      color: var(--color-text-secondary);
      margin: 0;
      line-height: 1.5;
    }
    .stat-latest-badge {
      position: relative;
      z-index: 1;
      font-size: .6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--brand-sky), #1e5fa8);
      color: #fff;
      border-radius: 20px;
      padding: 4px 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(14,165,233,.25);
    }

    /* ─── Overall Stats Row ──────────────────────── */
    .stat-overall-section {
      padding: 1.75rem 2rem;
      border-bottom: 1px solid var(--color-border-light);
    }
    .stat-section-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--color-text-secondary);
      margin: 0 0 1.25rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .stat-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border-light);
    }
    .stat-overall-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .stat-overall-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
      padding: 1.5rem .75rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      text-align: center;
      transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease;
    }
    .stat-overall-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(14,165,233,.15), 0 0 15px rgba(135, 206, 235, 0.1);
    }
    .stat-overall-value {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--brand-sky), var(--brand-sky-light, #a8d8ea));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-overall-label {
      font-size: .75rem;
      font-weight: 700;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    /* ─── Groups Section ─────────────────────────── */
    .stat-groups-section {
      padding: 1.75rem 2rem;
    }
    .stat-groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
      gap: 1rem;
    }
    .stat-group-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      padding: 1.5rem 1rem;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      cursor: pointer;
      transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease, border-color .3s ease;
      text-align: center;
      overflow: hidden;
    }
    .stat-group-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-sky), var(--brand-gold));
      opacity: 0;
      transition: opacity .3s;
    }
    .stat-group-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 35px rgba(14,165,233,.2), 0 0 20px rgba(135, 206, 235, 0.1);
      border-color: rgba(14,165,233,.35);
    }
    .stat-group-card:hover::before { opacity: 1; }

    .stat-group-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }

    /* Men / Female split row inside group card */
    .stat-group-split {
      display: flex;
      gap: 0;
      width: 100%;
      border: 1px solid var(--color-border-light);
      border-radius: 12px;
      overflow: hidden;
      margin: .15rem 0;
    }
    .stat-group-split-cell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: .65rem .25rem;
    }
    .stat-group-split-cell:first-child {
      border-right: 1px solid var(--color-border-light);
      background: rgba(99,102,241,.06);
    }
    .stat-group-split-cell:last-child {
      background: rgba(236,72,153,.06);
    }
    .stat-group-split-value {
      font-size: 1.35rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--brand-sky), var(--brand-sky-light, #a8d8ea));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-group-split-label {
      font-size: .62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--color-text-secondary);
      margin-top: 3px;
    }

    .stat-group-total-badge {
      font-size: .75rem;
      font-weight: 800;
      color: var(--brand-sky);
      background: rgba(14,165,233,.08);
      border: 1px solid rgba(14,165,233,.15);
      border-radius: 20px;
      padding: 4px 14px;
      letter-spacing: .3px;
    }
    .stat-group-hint {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: .68rem;
      font-weight: 700;
      color: var(--brand-sky);
      opacity: .9;
      transition: opacity .2s;
    }
    .stat-group-card:hover .stat-group-hint {
      opacity: 1;
    }
    .stat-group-no-members {
      font-size: .65rem;
      color: var(--color-text-secondary);
      opacity: .6;
    }

    /* ─── Empty State ────────────────────────────── */
    .stat-empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--color-text-secondary);
    }
    .stat-empty-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    /* ─── GROUP MEMBERS MODAL ────────────────────── */
    .group-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9998;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .group-modal-backdrop.active { display: flex; }

    @media (min-width: 600px) {
      .group-modal-backdrop {
        align-items: center;
        padding: 1.5rem;
      }
    }

    .group-modal-sheet {
      background: var(--color-bg-card);
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -12px 60px rgba(0,0,0,.22);
      animation: slideUp .3s cubic-bezier(.22,.68,0,1.2);
    }
    @media (min-width: 600px) {
      .group-modal-sheet {
        border-radius: 20px;
        max-height: 80vh;
        box-shadow: 0 24px 80px rgba(0,0,0,.22);
      }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* Drag handle (mobile) */
    .group-modal-handle {
      width: 40px; height: 4px;
      background: var(--color-border);
      border-radius: 4px;
      margin: .75rem auto .25rem;
      flex-shrink: 0;
    }
    @media (min-width: 600px) { .group-modal-handle { display: none; } }

    .group-modal-header {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: 1.25rem 1.5rem 1rem;
      flex-shrink: 0;
    }
    .group-modal-avatar {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand-sky), #1e5fa8);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .group-modal-title-wrap { flex: 1; min-width: 0; }
    .group-modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 .1rem;
    }
    .group-modal-subtitle {
      font-size: .75rem;
      color: var(--color-text-secondary);
      margin: 0;
    }
    .group-modal-close {
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border-light);
      color: var(--color-text-secondary);
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
      flex-shrink: 0;
    }
    .group-modal-close:hover {
      background: var(--color-bg-hover);
      color: var(--color-text);
    }

    /* Stat pills row inside modal */
    .group-modal-stats {
      display: flex;
      gap: .75rem;
      padding: 0 1.5rem 1.25rem;
      flex-shrink: 0;
    }
    .group-modal-stat-pill {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: .75rem .5rem;
      border-radius: 12px;
      border: 1px solid var(--color-border-light);
    }
    .pill-men    { background: rgba(99,102,241,.07); }
    .pill-female { background: rgba(236,72,153,.07); }
    .pill-total  { background: rgba(14,165,233,.07); }
    .group-modal-stat-value {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--brand-sky), var(--brand-sky-light, #a8d8ea));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .group-modal-stat-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    /* Divider */
    .group-modal-divider {
      height: 1px;
      background: var(--color-border-light);
      margin: 0 1.5rem;
      flex-shrink: 0;
    }

    .group-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem 1.5rem;
    }

    /* Search */
    .member-search-wrap {
      position: relative;
      margin-bottom: .85rem;
    }
    .member-search-icon {
      position: absolute;
      left: .85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: .85rem;
      pointer-events: none;
      color: var(--color-text-secondary);
    }
    .member-search-input {
      width: 100%;
      box-sizing: border-box;
      padding: .65rem 1rem .65rem 2.4rem;
      border: 1.5px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-bg-alt);
      color: var(--color-text);
      font-size: .875rem;
      outline: none;
      transition: border-color .2s;
    }
    .member-search-input:focus { border-color: var(--brand-sky); }

    /* Member count label */
    .member-count-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--color-text-secondary);
      margin: 0 0 .5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Member list */
    .member-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }
    .member-list-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .55rem .75rem;
      border-radius: 10px;
      transition: background .15s;
    }
    .member-list-item:hover { background: var(--color-bg-alt); }
    .member-number {
      font-size: .65rem;
      font-weight: 700;
      color: var(--color-text-secondary);
      min-width: 1.6rem;
      text-align: right;
      flex-shrink: 0;
    }
    .member-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-sky), #1e5fa8);
      color: #fff;
      font-size: .85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: 0;
    }
    .member-name {
      font-size: .9rem;
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.3;
    }
    /* ─── Year Filter ────────────────────────────── */
    .year-filter-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .year-filter-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .year-filter-select-wrapper {
      position: relative;
    }
    .year-filter-select-wrapper::after {
      content: '▼';
      font-size: 0.6rem;
      color: var(--color-text-secondary);
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .year-filter-select {
      appearance: none;
      -webkit-appearance: none;
      padding: 0.5rem 2.5rem 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--color-text);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .year-filter-select:focus {
      border-color: var(--brand-sky);
      box-shadow: 0 0 0 3px rgba(135, 206, 235, 0.2);
    }
    
    .member-empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--color-text-secondary);
      font-size: .875rem;
    }

    /* ─── Responsive tweaks ──────────────────────── */
    @media (max-width: 767px) {
      .stat-groups-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
    }
    
    @media (max-width: 479px) {
      .page-title-section { padding: var(--sp-3) 0 var(--sp-2) 0 !important; }
      .page-title-section h1 { font-size: 1.5rem !important; }
      .section { padding-top: 0.5rem !important; }
      
      .stat-entry-header { padding: 0.75rem 1rem; gap: 0.5rem; }
      .stat-entry-year-text { font-size: 1.4rem; }
      .stat-entry-title { font-size: 1.1rem; margin-bottom: 0; }
      .stat-entry-desc { display: none; }
      .stat-entry-year-bubble { padding: 0.25rem 0.5rem; border-radius: 8px; }
      .stat-latest-badge { padding: 2px 8px; font-size: 0.55rem; }
      
      .stat-overall-section,
      .stat-groups-section { padding: 0.75rem 1rem; }
      .stat-section-label { margin: 0 0 0.5rem; font-size: 0.6rem; }
      
      .stat-overall-grid { gap: 0.5rem; }
      .stat-overall-card { padding: 0.5rem 0.25rem; gap: 0.2rem; border-radius: 10px; }
      .stat-overall-value { font-size: 1.5rem; }
      .stat-overall-label { font-size: 0.55rem; letter-spacing: 0.2px; }
      
      /* Compact list style for groups to fit on one screen vertically */
      .stat-groups-grid { 
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .stat-group-card { 
        flex-direction: row; 
        padding: 0.5rem 0.75rem; 
        gap: 0.5rem; 
        border-radius: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .stat-group-card::before { display: none; }
      
      .stat-group-name { font-size: 0.95rem; margin: 0; flex: 1; text-align: left; }
      
      .stat-group-split { 
        width: auto; 
        margin: 0; 
        border: none; 
        background: transparent;
        gap: 0.4rem;
      }
      .stat-group-split-cell { 
        padding: 0; 
        background: transparent !important; 
        border: none !important; 
        flex-direction: row;
        align-items: baseline;
        gap: 2px;
      }
      .stat-group-split-value { font-size: 0.95rem; }
      .stat-group-split-label { 
        font-size: 0.55rem; 
        letter-spacing: 0; 
        margin: 0;
      }
      
      .stat-group-total-badge { font-size: 0.65rem; padding: 2px 8px; }
      .stat-group-hint { display: none; } /* Hide hint on mobile to save vertical space */
    }
  </style>
</head>

<body>
  <header class="site-header" id="site-header"></header>

  <main class="main-content">

    <section class="page-title-section mizo-pattern-subtle" style="padding: var(--sp-6) 0 var(--sp-2) 0;">
      <div class="container" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <h1 class="reveal" style="font-size: clamp(1.8rem, 4vw, 2.2rem); margin-bottom: .35rem;">Branch Statistics</h1>
        </div>
        
        <!-- Year Filter -->
        <div class="reveal year-filter-wrap">
          <label for="year-select" class="year-filter-label">Filter by Year:</label>
          <div class="year-filter-select-wrapper">
            <select id="year-select" class="year-filter-select" onchange="filterByYear(this.value)">
              <option value="all">All Years</option>
              <!-- Options populated by JS -->
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- Content -->
    <section class="section" style="padding-top: 0.5rem;">
      <div class="container">
        <div id="statistics-list" style="display: flex; flex-direction: column; gap: 2rem; max-width: 860px; margin: 0 auto;">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- ── GROUP MEMBERS MODAL ─────────────────────── -->
  <div class="group-modal-backdrop" id="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-modal-title-text">
    <div class="group-modal-sheet">
      <div class="group-modal-handle"></div>

      <!-- Header -->
      <div class="group-modal-header">
        <div class="group-modal-avatar" id="group-modal-avatar">J</div>
        <div class="group-modal-title-wrap">
          <h2 class="group-modal-title" id="group-modal-title-text"></h2>
          <p class="group-modal-subtitle" id="group-modal-subtitle"></p>
        </div>
        <button class="group-modal-close" id="group-modal-close" aria-label="Close">✕</button>
      </div>

      <!-- Stat pills -->
      <div class="group-modal-stats" id="group-modal-stats"></div>

      <div class="group-modal-divider"></div>

      <!-- Scrollable body -->
      <div class="group-modal-body">
        <div class="member-search-wrap">
          <input type="text" class="member-search-input" id="member-search" autocomplete="off" style="padding-left: 1.25rem;">
        </div>
        <p class="member-count-label">
          <span id="member-count-label">Members</span>
        </p>
        <ul class="member-list" id="member-list"></ul>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=105"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=105"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=105"></script>
  <script src="assets/js/firebase-config.js?v=105"></script>
  <script src="assets/js/theme.js?v=105"></script>
  <script src="assets/js/data.js?v=105"></script>
  <script src="assets/js/auth.js?v=105"></script>
  <script src="assets/js/db-service.js?v=105"></script>
  <script src="assets/js/save-service.js?v=105"></script>
  <script src="assets/js/components.js?v=105"></script>
  <script src="assets/js/search.js?v=105"></script>
  <script src="assets/js/app.js?v=105"></script>

  <script>
    /* ================================================
       PAGE INIT
       ================================================ */
    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader('statistic');
      renderFooter();
      renderStatisticsPage();

      try {
        const statsData = await DbService.get('statistics').catch(() => null);
        if (statsData && Array.isArray(statsData)) {
          Statistics.length = 0;
          Statistics.push(...statsData);
          localStorage.setItem('db_statistics', JSON.stringify(statsData));
          renderStatisticsPage();
        }
      } catch (err) {
        console.error('Error loading statistics:', err);
      }

      setupModal();
    });

    /* ================================================
       RENDER ENTRIES
       ================================================ */
    let currentYearFilter = 'all';

    function filterByYear(year) {
      currentYearFilter = year;
      renderStatisticsPage();
    }

    function renderStatisticsPage() {
      const container = document.getElementById('statistics-list');
      const yearSelect = document.getElementById('year-select');
      if (!container) return;

      if (!Statistics || Statistics.length === 0) {
        container.innerHTML = `
          <div class="stat-empty reveal">
            <h3 style="margin-bottom:.5rem;">No Statistics Available</h3>
            <p>Check back later for updated branch statistics.</p>
          </div>`;
        if (yearSelect) yearSelect.disabled = true;
        return;
      }

      // Populate year filter options (only once or when missing options)
      if (yearSelect && yearSelect.options.length <= 1) {
        const uniqueYears = [...new Set(Statistics.map(s => s.year).filter(y => y))].sort((a, b) => b - a);
        yearSelect.innerHTML = '<option value="all">All Years</option>';
        uniqueYears.forEach(year => {
          const opt = document.createElement('option');
          opt.value = year;
          opt.textContent = year;
          yearSelect.appendChild(opt);
        });
        yearSelect.disabled = false;
      }

      const filteredStats = currentYearFilter === 'all' 
        ? [...Statistics] 
        : Statistics.filter(s => String(s.year) === currentYearFilter);

      if (filteredStats.length === 0) {
        container.innerHTML = `
          <div class="stat-empty reveal">
            <h3 style="margin-bottom:.5rem;">No Data for ${currentYearFilter}</h3>
            <p>There are no statistics available for the selected year.</p>
          </div>`;
        return;
      }

      const sorted = filteredStats.sort((a, b) => {
        const ai = typeof a.orderIndex === 'number' ? a.orderIndex : 999999;
        const bi = typeof b.orderIndex === 'number' ? b.orderIndex : 999999;
        if (ai !== bi) return ai - bi;
        return new Date(b.date) - new Date(a.date);
      });

      container.innerHTML = sorted.map((stat, index) => {
        const groups  = Array.isArray(stat.groups) ? stat.groups : [];
        const isLatest = index === 0;

        const groupsHtml = groups.length > 0 ? `
          <div class="stat-groups-section">
            <p class="stat-section-label">Groups</p>
            <div class="stat-groups-grid">
              ${groups.map((g, gi) => {
                const hasMembers = Array.isArray(g.members) && g.members.length > 0;
                const initial = (g.name || '?').charAt(0).toUpperCase();
                return `
                  <div class="stat-group-card"
                       onclick="openGroupModal('${stat.id}', ${gi})"
                       role="button"
                       tabindex="0"
                       aria-label="View ${g.name} group members"
                       onkeydown="if(event.key==='Enter')openGroupModal('${stat.id}',${gi})">
                    <div class="stat-group-name">${g.name}</div>
                    <div class="stat-group-split">
                      <div class="stat-group-split-cell">
                        <span class="stat-group-split-value" data-target="${g.men || 0}">${g.men || 0}</span>
                        <span class="stat-group-split-label">Men</span>
                      </div>
                      <div class="stat-group-split-cell">
                        <span class="stat-group-split-value" data-target="${g.female || 0}">${g.female || 0}</span>
                        <span class="stat-group-split-label">Female</span>
                      </div>
                    </div>
                    <span class="stat-group-total-badge">Total: ${g.total || (g.men||0)+(g.female||0)}</span>
                    ${hasMembers
                      ? `<div class="stat-group-hint">View ${g.members.length} members →</div>`
                      : `<div class="stat-group-no-members">No member list yet</div>`}
                  </div>`;
              }).join('')}
            </div>
          </div>` : '';

        return `
          <div class="stat-entry reveal">

            <!-- Header Banner -->
            <div class="stat-entry-header">
              <div class="stat-entry-year-bubble">
                <span class="stat-entry-year-text">${stat.year || '—'}</span>
                <span class="stat-entry-year-label">Year</span>
              </div>
              <div class="stat-entry-meta">
                <h2 class="stat-entry-title">${stat.title || 'Statistics'}</h2>
                ${stat.description ? `<p class="stat-entry-desc">${stat.description}</p>` : ''}
              </div>
              ${isLatest ? '<span class="stat-latest-badge">Latest</span>' : ''}
            </div>

            <!-- Overall Membership -->
            <div class="stat-overall-section">
              <p class="stat-section-label">Overall Membership</p>
              <div class="stat-overall-grid">
                <div class="stat-overall-card">
                  <span class="stat-overall-value" data-target="${stat.totalMembers || 0}">${stat.totalMembers || 0}</span>
                  <span class="stat-overall-label">Total Members</span>
                </div>
                <div class="stat-overall-card">
                  <span class="stat-overall-value" data-target="${stat.men || 0}">${stat.men || 0}</span>
                  <span class="stat-overall-label">Men</span>
                </div>
                <div class="stat-overall-card">
                  <span class="stat-overall-value" data-target="${stat.female || 0}">${stat.female || 0}</span>
                  <span class="stat-overall-label">Female</span>
                </div>
              </div>
            </div>

            ${groupsHtml}
          </div>`;
      }).join('');

      animateCounters();
      setTimeout(() => { if (typeof setupScrollReveal === 'function') setupScrollReveal(); }, 50);
    }

    /* ================================================
       COUNTER ANIMATION
       ================================================ */
    function animateCounters() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          if (el.dataset.animated) return;
          el.dataset.animated = 'true';
          const target = parseInt(el.getAttribute('data-target'), 10);
          if (isNaN(target)) return;
          let cur = 0;
          const step = Math.max(1, Math.floor(target / 60));
          const timer = setInterval(() => {
            cur = Math.min(cur + step, target);
            el.textContent = cur;
            if (cur >= target) clearInterval(timer);
          }, 20);
          io.unobserve(el);
        });
      }, { threshold: 0.3 });
      document.querySelectorAll('[data-target]').forEach(el => io.observe(el));
    }

    /* ================================================
       GROUP MODAL
       ================================================ */
    let _currentMembers = [];
    let _currentGroup   = null;

    function setupModal() {
      const backdrop   = document.getElementById('group-modal');
      const closeBtn   = document.getElementById('group-modal-close');
      const searchInput = document.getElementById('member-search');

      closeBtn.addEventListener('click', closeGroupModal);
      backdrop.addEventListener('click', e => { if (e.target === backdrop) closeGroupModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGroupModal(); });
      searchInput.addEventListener('input', () => filterMemberList(searchInput.value.trim().toLowerCase()));
    }

    function openGroupModal(statId, groupIndex) {
      const stat  = Statistics.find(s => s.id === statId);
      if (!stat) return;
      const group = (stat.groups || [])[groupIndex];
      if (!group) return;

      _currentMembers = Array.isArray(group.members) ? group.members : [];
      _currentGroup   = group;

      const initial = (group.name || '?').charAt(0).toUpperCase();

      // Avatar
      document.getElementById('group-modal-avatar').textContent = initial;

      // Header text
      document.getElementById('group-modal-title-text').textContent = `${group.name} Group`;
      document.getElementById('group-modal-subtitle').textContent    = stat.title || stat.year || '';

      // Stat pills
      const total = group.total || (group.men||0) + (group.female||0);
      document.getElementById('group-modal-stats').innerHTML = `
        <div class="group-modal-stat-pill pill-men">
          <span class="group-modal-stat-value">${group.men || 0}</span>
          <span class="group-modal-stat-label">Men</span>
        </div>
        <div class="group-modal-stat-pill pill-female">
          <span class="group-modal-stat-value">${group.female || 0}</span>
          <span class="group-modal-stat-label">Female</span>
        </div>
        <div class="group-modal-stat-pill pill-total">
          <span class="group-modal-stat-value">${total}</span>
          <span class="group-modal-stat-label">Total</span>
        </div>`;

      // Reset search
      document.getElementById('member-search').value = '';
      renderMemberList(_currentMembers);

      document.getElementById('group-modal').classList.add('active');
      document.body.classList.add('modal-open');
      if (_currentMembers.length > 0) {
        setTimeout(() => document.getElementById('member-search').focus(), 100);
      }
    }

    function closeGroupModal() {
      document.getElementById('group-modal').classList.remove('active');
      document.body.classList.remove('modal-open');
    }

    function filterMemberList(query) {
      const filtered = query
        ? _currentMembers.filter(m => m.toLowerCase().includes(query))
        : _currentMembers;
      renderMemberList(filtered, query);
    }

    function renderMemberList(members, highlight = '') {
      const list  = document.getElementById('member-list');
      const label = document.getElementById('member-count-label');

      if (!members || members.length === 0) {
        if (label) label.textContent = 'Members';
        list.innerHTML = `<li class="member-empty">
          ${highlight ? 'No members match your search.' : 'No member names added yet.'}
        </li>`;
        return;
      }

      if (label) label.textContent = `${members.length} Member${members.length !== 1 ? 's' : ''}`;

      list.innerHTML = members.map((name, i) => {
        const initial     = name.trim().charAt(0).toUpperCase() || '?';
        const displayName = highlight
          ? name.replace(new RegExp(`(${highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'),
              '<mark style="background:rgba(14,165,233,.18);border-radius:3px;padding:0 2px;">$1</mark>')
          : name;
        return `
          <li class="member-list-item">
            <span class="member-number">${i + 1}.</span>
            <div class="member-avatar">${initial}</div>
            <span class="member-name">${displayName}</span>
          </li>`;
      }).join('');
    }
  </script>
</body>
</html>
