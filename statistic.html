<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics — KṬP Saikhamakawn</title>
  <meta name="description" content="Branch statistics and membership numbers for KṬP Saikhamakawn — Kristian Ṭhalai Pawl.">
  <meta name="keywords" content="KTP Saikhamakawn statistics, members, branch data, Mizo church">
  <meta property="og:title" content="Statistics — KṬP Saikhamakawn">
  <meta property="og:description" content="Branch statistics and membership numbers for KṬP Saikhamakawn.">
  <meta property="og:image" content="assets/images/logo.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/variables.css?v=117">
  <link rel="stylesheet" href="assets/css/base.css?v=117">
  <link rel="stylesheet" href="assets/css/mizo-patterns.css?v=117">
  <link rel="stylesheet" href="assets/css/animations.css?v=117">
  <link rel="stylesheet" href="assets/css/components.css?v=117">
  <link rel="stylesheet" href="assets/css/layout.css?v=117">
  <link rel="stylesheet" href="assets/css/pages.css?v=117">

  <style>
    /* ================================================
       STATISTICS PAGE  — Premium Redesign
       ================================================ */

    /* ─── Entry Card ─────────────────────────────── */
    .stat-entry {
      background: #1a202c; /* Dark slate */
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    /* ─── Header Banner ──────────────────────────── */
    .stat-entry-header {
      display: flex;
      align-items: center;
      padding: 1.5rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 1.2rem;
    }
    .stat-entry-year-bubble {
      background: transparent;
      border: 1px solid rgba(59, 130, 246, 0.3); /* Blue border */
      border-radius: 8px;
      padding: 0.5rem 1rem;
      text-align: center;
      flex-shrink: 0;
    }
    .stat-entry-year-text {
      display: block;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
      color: #7dd3fc; /* Light blue */
    }
    .stat-entry-year-label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8; /* Slate 400 */
      margin-top: 4px;
      font-weight: 700;
    }
    .stat-entry-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      flex: 1;
      text-transform: capitalize;
    }
    .stat-latest-badge {
      font-size: 0.7rem;
      font-weight: 800;
      background: #3b82f6; /* Blue */
      color: #ffffff;
      border-radius: 20px;
      padding: 6px 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    /* ─── Overall Stats Row ──────────────────────── */
    .stat-overall-section {
      padding: 1.5rem 1.5rem;
    }
    .stat-section-label {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #cbd5e1; /* lighter gray */
      margin: 0 0 1rem;
    }
    .stat-overall-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .stat-overall-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 1.2rem 0.5rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      text-align: center;
    }
    .stat-overall-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #7dd3fc;
      line-height: 1;
    }
    .stat-overall-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* ─── Groups Section ─────────────────────────── */
    .stat-groups-section {
      padding: 0 1.5rem 1.5rem;
    }
    .stat-groups-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .stat-group-card {
      display: flex;
      align-items: center;
      padding: 1rem 1.2rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      gap: 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .stat-group-card:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .stat-group-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      min-width: 70px;
    }
    .stat-group-split {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex: 1;
    }
    .stat-group-split-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .stat-group-split-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #7dd3fc;
    }
    .stat-group-split-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #e2e8f0;
      text-transform: uppercase;
    }
    .stat-group-total-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.3);
      border-radius: 20px;
      padding: 4px 12px;
      color: #7dd3fc;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .stat-group-total-badge span {
      font-size: 0.85rem;
    }
    .stat-group-hint {
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      min-width: 90px;
      line-height: 1.2;
    }

    /* ─── Empty State ────────────────────────────── */
    .stat-empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--color-text-secondary);
    }
    .stat-empty-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    /* ─── GROUP MEMBERS MODAL ────────────────────── */
    .group-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 9998;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .group-modal-backdrop.active { display: flex; }

    @media (min-width: 600px) {
      .group-modal-backdrop {
        align-items: center;
        padding: 1.5rem;
      }
    }

    .group-modal-sheet {
      background: var(--color-bg-card);
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -12px 60px rgba(0,0,0,.22);
      animation: slideUp .3s cubic-bezier(.22,.68,0,1.2);
    }
    @media (min-width: 600px) {
      .group-modal-sheet {
        border-radius: 20px;
        max-height: 80vh;
        box-shadow: 0 24px 80px rgba(0,0,0,.22);
      }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* Drag handle (mobile) */
    .group-modal-handle {
      width: 40px; height: 4px;
      background: var(--color-border);
      border-radius: 4px;
      margin: .75rem auto .25rem;
      flex-shrink: 0;
    }
    @media (min-width: 600px) { .group-modal-handle { display: none; } }

    .group-modal-header {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: 1.25rem 1.5rem 1rem;
      flex-shrink: 0;
    }
    .group-modal-avatar {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand-sky), #1e5fa8);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .group-modal-title-wrap { flex: 1; min-width: 0; }
    .group-modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 .1rem;
    }
    .group-modal-subtitle {
      font-size: .75rem;
      color: var(--color-text-secondary);
      margin: 0;
    }
    .group-modal-close {
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border-light);
      color: var(--color-text-secondary);
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
      flex-shrink: 0;
    }
    .group-modal-close:hover {
      background: var(--color-bg-hover);
      color: var(--color-text);
    }

    /* Stat pills row inside modal */
    .group-modal-stats {
      display: flex;
      gap: .75rem;
      padding: 0 1.5rem 1.25rem;
      flex-shrink: 0;
    }
    .group-modal-stat-pill {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: .75rem .5rem;
      border-radius: 12px;
      border: 1px solid var(--color-border-light);
    }
    .pill-men    { background: rgba(99,102,241,.07); }
    .pill-female { background: rgba(236,72,153,.07); }
    .pill-total  { background: rgba(14,165,233,.07); }
    .group-modal-stat-value {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--brand-sky), var(--brand-sky-light, #a8d8ea));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .group-modal-stat-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    /* Divider */
    .group-modal-divider {
      height: 1px;
      background: var(--color-border-light);
      margin: 0 1.5rem;
      flex-shrink: 0;
    }

    .group-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem 1.5rem;
    }

    /* Search */
    .member-search-wrap {
      position: relative;
      margin-bottom: .85rem;
    }
    .member-search-icon {
      position: absolute;
      left: .85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: .85rem;
      pointer-events: none;
      color: var(--color-text-secondary);
    }
    .member-search-input {
      width: 100%;
      box-sizing: border-box;
      padding: .65rem 1rem .65rem 2.4rem;
      border: 1.5px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-bg-alt);
      color: var(--color-text);
      font-size: .875rem;
      outline: none;
      transition: border-color .2s;
    }
    .member-search-input:focus { border-color: var(--brand-sky); }

    /* Member count label */
    .member-count-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--color-text-secondary);
      margin: 0 0 .5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Member list */
    .member-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }
    .member-list-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .55rem .75rem;
      border-radius: 10px;
      transition: background .15s;
    }
    .member-list-item:hover { background: var(--color-bg-alt); }
    .member-number {
      font-size: .65rem;
      font-weight: 700;
      color: var(--color-text-secondary);
      min-width: 1.6rem;
      text-align: right;
      flex-shrink: 0;
    }
    .member-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-sky), #1e5fa8);
      color: #fff;
      font-size: .85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: 0;
    }
    .member-name {
      font-size: .9rem;
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.3;
    }
    /* ─── Year Filter ────────────────────────────── */
    .year-filter-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .year-filter-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .year-filter-select-wrapper {
      position: relative;
    }
    .year-filter-select-wrapper::after {
      content: '▼';
      font-size: 0.6rem;
      color: var(--color-text-secondary);
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .year-filter-select {
      appearance: none;
      -webkit-appearance: none;
      padding: 0.5rem 2.5rem 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--color-text);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .year-filter-select:focus {
      border-color: var(--brand-sky);
      box-shadow: 0 0 0 3px rgba(135, 206, 235, 0.2);
    }
    
    .member-empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--color-text-secondary);
      font-size: .875rem;
    }

    /* ─── Responsive tweaks ──────────────────────── */
    @media (max-width: 767px) {
      .stat-groups-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
    }
    
    @media (max-width: 479px) {
      .page-title-section { padding: var(--sp-3) 0 var(--sp-2) 0 !important; }
      .page-title-section h1 { font-size: 1.5rem !important; }
      .section { padding-top: 0.5rem !important; }
      
      .stat-entry-header { padding: 0.75rem 1rem; gap: 0.5rem; }
      .stat-entry-year-text { font-size: 1.4rem; }
      .stat-entry-title { font-size: 1.1rem; margin-bottom: 0; }
      .stat-entry-desc { display: none; }
      .stat-entry-year-bubble { padding: 0.25rem 0.5rem; border-radius: 8px; }
      .stat-latest-badge { padding: 2px 8px; font-size: 0.55rem; }
      
      .stat-overall-section,
      .stat-groups-section { padding: 0.75rem 1rem; }
      .stat-section-label { margin: 0 0 0.5rem; font-size: 0.6rem; }
      
      .stat-overall-grid { gap: 0.5rem; }
      .stat-overall-card { padding: 0.5rem 0.25rem; gap: 0.2rem; border-radius: 10px; }
      .stat-overall-value { font-size: 1.5rem; }
      .stat-overall-label { font-size: 0.55rem; letter-spacing: 0.2px; }
      
      /* Compact list style for groups to fit on one screen vertically */
      .stat-groups-grid { 
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .stat-group-card { 
        flex-direction: row; 
        padding: 0.75rem 0.75rem; 
        gap: 0.5rem; 
        border-radius: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      
      .stat-group-name { font-size: 0.95rem; margin: 0; min-width: 60px; }
      
      .stat-group-split { 
        width: auto; 
        margin: 0; 
        gap: 8px;
      }
      .stat-group-split-item { 
        flex-direction: row;
        align-items: baseline;
        gap: 2px;
      }
      .stat-group-split-value { font-size: 0.95rem; }
      .stat-group-split-label { 
        font-size: 0.55rem; 
        letter-spacing: 0; 
        margin: 0;
      }
      
      .stat-group-total-badge { font-size: 0.65rem; padding: 2px 8px; }
      .stat-group-hint { display: none; } /* Hide hint on mobile to save vertical space */
    }
  </style>
</head>

<body>
  <header class="site-header" id="site-header"></header>

  <main class="main-content">

    <section class="page-title-section mizo-pattern-subtle" style="padding: var(--sp-6) 0 var(--sp-2) 0;">
      <div class="container" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <h1 class="reveal" style="font-size: clamp(1.8rem, 4vw, 2.2rem); margin-bottom: .35rem;">Branch Statistics</h1>
        </div>
        
        <!-- Year Filter -->
        <div class="reveal year-filter-wrap">
          <label for="year-select" class="year-filter-label">Filter by Year:</label>
          <div class="year-filter-select-wrapper">
            <select id="year-select" class="year-filter-select" onchange="filterByYear(this.value)">
              <option value="all">All Years</option>
              <!-- Options populated by JS -->
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- Content -->
    <section class="section" style="padding-top: 0.5rem;">
      <div class="container">
        <div id="statistics-list" style="display: flex; flex-direction: column; gap: 2rem; max-width: 860px; margin: 0 auto;">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- ── PDF VIEWER MODAL ─────────────────────── -->
  <div class="modal-backdrop lightbox-modal" id="doc-modal" style="background: rgba(0,0,0,0.95); padding: 0;">
    <div style="position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; padding: 0;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(0,0,0,0.5); z-index: 10;">
         <h3 id="modal-doc-title" style="color: white; margin: 0; font-size: 1.2rem; font-weight: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Group PDF</h3>
         <div style="display: flex; gap: 16px; align-items: center;">
           <a href="#" id="modal-doc-download" target="_blank" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 8px;" title="Open in New Tab">
             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
           </a>
           <button id="close-doc-modal" aria-label="Close" style="background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;">
             <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
           </button>
         </div>
      </div>
      <div style="flex: 1; position: relative; width: 100%; height: 100%; background: #fff;">
        <iframe id="modal-doc-iframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=117"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=117"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=117"></script>
  <script defer src="assets/js/firebase-config.js?v=117"></script>
  <script defer src="assets/js/theme.js?v=117"></script>
  <script defer src="assets/js/data.js?v=117"></script>
  <script defer src="assets/js/auth.js?v=117"></script>
  <script defer src="assets/js/db-service.js?v=117"></script>
  <script defer src="assets/js/save-service.js?v=117"></script>
  <script defer src="assets/js/components.js?v=117"></script>
  <script defer src="assets/js/search.js?v=117"></script>
  <script defer src="assets/js/app.js?v=117"></script>

  <script>
    /* ================================================
       PAGE INIT
       ================================================ */
    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader('statistic');
      renderFooter();
      renderStatisticsPage();

      try {
        const statsData = await DbService.get('statistics').catch(() => null);
        if (statsData && Array.isArray(statsData)) {
          Statistics.length = 0;
          Statistics.push(...statsData);
          localStorage.setItem('db_statistics', JSON.stringify(statsData));
          renderStatisticsPage();
        }
      } catch (err) {
        console.error('Error loading statistics:', err);
      }

      setupModal();
    });

    /* ================================================
       RENDER ENTRIES
       ================================================ */
    let currentYearFilter = 'all';

    function filterByYear(year) {
      currentYearFilter = year;
      renderStatisticsPage();
    }

    function renderStatisticsPage() {
      const container = document.getElementById('statistics-list');
      const yearSelect = document.getElementById('year-select');
      if (!container) return;

      if (!Statistics || Statistics.length === 0) {
        container.innerHTML = `
          <div class="stat-empty reveal">
            <h3 style="margin-bottom:.5rem;">No Statistics Available</h3>
            <p>Check back later for updated branch statistics.</p>
          </div>`;
        if (yearSelect) yearSelect.disabled = true;
        return;
      }

      // Populate year filter options (only once or when missing options)
      if (yearSelect && yearSelect.options.length <= 1) {
        const uniqueYears = [...new Set(Statistics.map(s => s.year).filter(y => y))].sort((a, b) => b - a);
        yearSelect.innerHTML = '<option value="all">All Years</option>';
        uniqueYears.forEach(year => {
          const opt = document.createElement('option');
          opt.value = year;
          opt.textContent = year;
          yearSelect.appendChild(opt);
        });
        yearSelect.disabled = false;
      }

      const filteredStats = currentYearFilter === 'all' 
        ? [...Statistics] 
        : Statistics.filter(s => String(s.year) === currentYearFilter);

      if (filteredStats.length === 0) {
        container.innerHTML = `
          <div class="stat-empty reveal">
            <h3 style="margin-bottom:.5rem;">No Data for ${currentYearFilter}</h3>
            <p>There are no statistics available for the selected year.</p>
          </div>`;
        return;
      }

      const sorted = filteredStats.sort((a, b) => {
        const ai = typeof a.orderIndex === 'number' ? a.orderIndex : 999999;
        const bi = typeof b.orderIndex === 'number' ? b.orderIndex : 999999;
        if (ai !== bi) return ai - bi;
        return new Date(b.date) - new Date(a.date);
      });

      container.innerHTML = sorted.map((stat, index) => {
        const groups  = Array.isArray(stat.groups) ? stat.groups : [];
        const isLatest = index === 0;

        const groupsHtml = groups.length > 0 ? `
          <div class="stat-groups-section">
            <p class="stat-section-label">Groups</p>
            <div class="stat-groups-grid">
              ${groups.map((g, gi) => {
                const hasPdf = !!g.pdfUrl;
                return `
                  <div class="stat-group-card"
                       onclick="${hasPdf ? `openPdfModal('${g.pdfUrl}', '${g.name.replace(/'/g, "\\'")}')` : `if(typeof Toast !== 'undefined') Toast.show('No PDF link available for this group.', 'error'); else alert('No PDF available for this group.');`}"
                       role="button"
                       tabindex="0"
                       aria-label="View ${g.name} group PDF"
                       onkeydown="if(event.key==='Enter') ${hasPdf ? `openPdfModal('${g.pdfUrl}', '${g.name.replace(/'/g, "\\'")}')` : `alert('No PDF available for this group.')`}">
                    <div class="stat-group-name">${g.name}</div>
                    <div class="stat-group-split">
                      <div class="stat-group-split-item">
                        <span class="stat-group-split-label">MIPA</span>
                        <span class="stat-group-split-value" data-target="${g.men || 0}">${g.men || 0}</span>
                      </div>
                      <div class="stat-group-split-item">
                        <span class="stat-group-split-label">HMEICHHIA</span>
                        <span class="stat-group-split-value" data-target="${g.female || 0}">${g.female || 0}</span>
                      </div>
                    </div>
                    <div class="stat-group-total-badge">
                      Total: <span data-target="${g.total || (g.men||0)+(g.female||0)}">${g.total || (g.men||0)+(g.female||0)}</span>
                    </div>
                    <div class="stat-group-hint">
                      ${hasPdf ? 'View PDF' : 'No PDF<br>available'}
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>` : '';

        return `
          <div class="stat-entry reveal">

            <!-- Header Banner -->
            <div class="stat-entry-header">
              <div class="stat-entry-year-bubble">
                <span class="stat-entry-year-text">${stat.year || '—'}</span>
                <span class="stat-entry-year-label">Year</span>
              </div>
              <h2 class="stat-entry-title">${stat.title || 'Branch Statistics'}</h2>
              ${isLatest ? '<span class="stat-latest-badge">Latest</span>' : ''}
            </div>

            <!-- Overall Membership -->
            <div class="stat-overall-section">
              <p class="stat-section-label">Overall Membership</p>
              <div class="stat-overall-grid">
                <div class="stat-overall-card">
                  <span class="stat-overall-label">Total Members</span>
                  <span class="stat-overall-value" data-target="${stat.totalMembers || 0}">${stat.totalMembers || 0}</span>
                </div>
                <div class="stat-overall-card">
                  <span class="stat-overall-label">Mipa</span>
                  <span class="stat-overall-value" data-target="${stat.men || 0}">${stat.men || 0}</span>
                </div>
                <div class="stat-overall-card">
                  <span class="stat-overall-label">Hmeichhia</span>
                  <span class="stat-overall-value" data-target="${stat.female || 0}">${stat.female || 0}</span>
                </div>
              </div>
            </div>

            ${groupsHtml}
          </div>`;
      }).join('');

      animateCounters();
      setTimeout(() => { if (typeof setupScrollReveal === 'function') setupScrollReveal(); }, 50);
    }

    /* ================================================
       COUNTER ANIMATION
       ================================================ */
    function animateCounters() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          if (el.dataset.animated) return;
          el.dataset.animated = 'true';
          const target = parseInt(el.getAttribute('data-target'), 10);
          if (isNaN(target)) return;
          let cur = 0;
          const step = Math.max(1, Math.floor(target / 60));
          const timer = setInterval(() => {
            cur = Math.min(cur + step, target);
            el.textContent = cur;
            if (cur >= target) clearInterval(timer);
          }, 20);
          io.unobserve(el);
        });
      }, { threshold: 0.3 });
      document.querySelectorAll('[data-target]').forEach(el => io.observe(el));
    }

    /* ================================================
       GROUP PDF MODAL
       ================================================ */
    function setupModal() {
      const closeBtn = document.getElementById('close-doc-modal');
      const closeAction = () => {
        const iframe = document.getElementById('modal-doc-iframe');
        if (iframe) iframe.src = '';
        if (typeof ModalSystem !== 'undefined') ModalSystem.close('doc-modal');
      };
      if (closeBtn) closeBtn.addEventListener('click', closeAction);
    }

    function openPdfModal(pdfUrl, groupName) {
      if (!pdfUrl) return;

      const modalTitle = document.getElementById('modal-doc-title');
      const modalDownload = document.getElementById('modal-doc-download');
      const modalIframe = document.getElementById('modal-doc-iframe');

      if (modalTitle) modalTitle.textContent = groupName + ' PDF';

      let fileId = '';
      if (pdfUrl && pdfUrl !== '#') {
        if (pdfUrl.includes('/file/d/')) {
          const parts = pdfUrl.split('/file/d/');
          if (parts.length > 1) {
            fileId = parts[1].split('/')[0];
          }
        } else if (pdfUrl.includes('id=')) {
          try {
            const urlObj = new URL(pdfUrl);
            fileId = urlObj.searchParams.get('id');
          } catch(e) {}
        }
      }

      if (modalIframe) {
        if (fileId) {
          modalIframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
        } else {
          modalIframe.src = pdfUrl;
        }
      }

      if (modalDownload) {
        modalDownload.href = pdfUrl;
      }

      if (typeof ModalSystem !== 'undefined') ModalSystem.open('doc-modal');
    }
  </script>
</body>
</html>
