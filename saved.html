<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Items — KṬP Saikhamakawn</title>
  <meta name="description" content="View and manage your saved lyrics, sermons, documents, and photos on KṬP Saikhamakawn.">
  <meta name="keywords" content="Saved items, KṬP Saikhamakawn, bookmarks, saved files">

  <!-- Open Graph -->
  <meta property="og:title" content="Saved Items — KṬP Saikhamakawn">
  <meta property="og:description" content="View and manage your saved lyrics, sermons, documents, and photos.">
  <meta property="og:image" content="assets/images/logo.png">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <!-- Preconnect for Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css?v=101">
  <link rel="stylesheet" href="assets/css/base.css?v=101">
  <link rel="stylesheet" href="assets/css/mizo-patterns.css?v=101">
  <link rel="stylesheet" href="assets/css/animations.css?v=101">
  <link rel="stylesheet" href="assets/css/components.css?v=101">
  <link rel="stylesheet" href="assets/css/layout.css?v=101">
  <link rel="stylesheet" href="assets/css/pages.css?v=101">
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="site-header"></header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Page Header -->
    <section class="page-title-section mizo-pattern-subtle">
      <div class="container">
        <h1 style="margin-top: var(--sp-4); margin-bottom: var(--sp-6);">🔖 Saved Items</h1>
      </div>
    </section>

    <!-- Content Area -->
    <section class="section-sm">
      <div class="container">
        
        <!-- Auth Required State -->
        <div id="saved-auth-required" class="card" style="display: none; max-width: 500px; margin: var(--sp-8) auto; text-align: center; padding: var(--sp-8) var(--sp-6); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
          <div style="font-size: 3rem; margin-bottom: var(--sp-4);">🔒</div>
          <h2 style="margin-bottom: var(--sp-2); font-weight: var(--fw-bold);">Login Required</h2>
          <p style="color: var(--color-text-secondary); margin-bottom: var(--sp-6);">Please log in to view and download your saved items.</p>
          <button id="saved-login-btn" class="btn btn-primary" style="margin: 0 auto;">🔑 Sign In Now</button>
        </div>

        <!-- Saved Content Area (Visible when logged in) -->
        <div id="saved-content-wrapper" style="display: none;">
          
          <!-- Category Tabs -->
          <div style="margin-bottom: var(--sp-6);">
            <p style="font-size: var(--fs-xs); color: var(--color-text-tertiary); font-weight: var(--fw-semibold); margin-bottom: var(--sp-2); text-transform: uppercase; letter-spacing: 0.5px;">Filter By Type</p>
            <div class="filter-bar no-scrollbar" id="saved-tabs" style="overflow-x: auto; padding-bottom: var(--sp-1); display: flex; gap: var(--sp-2);">
              <button class="filter-chip active" data-tab="all">All Items</button>
              <button class="filter-chip" data-tab="lyrics">🎵 Lyrics</button>
              <button class="filter-chip" data-tab="sermons">📖 Sermons</button>
              <button class="filter-chip" data-tab="mipui-aw">📄 Mipui Aw</button>
              <button class="filter-chip" data-tab="photos">📸 Photos</button>
            </div>
          </div>

          <!-- Selection Toolbar for Bulk Download -->
          <div id="selection-toolbar" class="floating-selection-toolbar" style="display: none;">
            <div style="display: flex; align-items: center; gap: var(--sp-3);">
              <label style="display: flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-medium);">
                <input type="checkbox" id="select-all-cb" style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand-sky);">
                Select All
              </label>
              <span id="selected-count" style="font-size: var(--fs-xs); color: var(--brand-sky); background: rgba(56, 189, 248, 0.15); padding: 2px 8px; border-radius: 12px; font-weight: var(--fw-bold);">0</span>
            </div>
            <div style="display: flex; gap: var(--sp-1); align-items: center;">
              <!-- Remove button for saved.html -->
              <button id="btn-bulk-save" class="btn-icon" disabled title="Remove Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
              <button id="btn-bulk-download" class="btn-icon" disabled title="Download Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>
            </div>
          </div>

          <!-- Results count/info -->
          <div class="results-info" style="margin-bottom: var(--sp-4);">
            <span class="results-count" id="saved-count">Loading saved items...</span>
          </div>

          <!-- Empty State -->
          <div id="saved-empty-state" class="empty-state" style="display: none; width: 100%; padding: var(--sp-8) 0;">
            <div class="empty-state-icon">🔖</div>
            <h3>No Saved Items</h3>
            <p>You haven't saved any items yet. Bookmark items from Lyrics, Sermons, Mipui Aw, or Gallery pages.</p>
          </div>

          <!-- Document List Grid (For Lyrics, Sermons, Mipui Aw) -->
          <div class="content-grid" id="saved-docs-list" style="grid-template-columns: 1fr; gap: var(--sp-3); margin-bottom: var(--sp-6);">
            <!-- Populated by JS -->
          </div>

          <!-- Gallery Masonry Grid (For Photos) -->
          <div class="masonry-grid" id="saved-photos-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6);">
            <!-- Populated by JS -->
          </div>

        </div>

      </div>
    </section>

    <!-- AdSense Placeholder -->
    <section class="section-sm">
      <div class="container">
        <div class="footer-adsense" style="margin: 0 auto; max-width: 728px;">
          Reserved for Google AdSense — Responsive Ad Unit
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- Scripts -->
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=101"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=101"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=101"></script>

  <!-- JSZip & FileSaver for Bulk Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js?v=101"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js?v=101"></script>

  <!-- App Configuration & Services -->
  <script src="assets/js/firebase-config.js?v=101"></script>
  <script src="assets/js/theme.js?v=101"></script>
  <script src="assets/js/data.js?v=101"></script>
  <script src="assets/js/auth.js?v=101"></script>
  <script src="assets/js/save-service.js?v=101"></script>
  <script src="assets/js/db-service.js?v=101"></script>
  <script src="assets/js/components.js?v=101"></script>
  <script src="assets/js/search.js?v=101"></script>
  <script src="assets/js/saved.js?v=101"></script>
  <script src="assets/js/app.js?v=101"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('saved');
      renderFooter();
    });
  </script>
</body>
</html>
