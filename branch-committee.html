    <style>
    .ob-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--sp-6);
      margin-top: var(--sp-5);
    }
    
    .ob-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    
    .ob-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1);
    }
    
    .ob-image-wrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--color-bg-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .ob-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; object-position: center 15%;
      transition: transform 0.5s ease;
    }
    
    .ob-card:hover .ob-image-wrapper img {
      transform: scale(1.05);
    }
    
    .ob-content-wrapper {
      padding: var(--sp-5) var(--sp-4);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .ob-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: var(--sp-2);
      color: var(--color-text);
      overflow-wrap: anywhere;
    }
    
    .ob-text {
      color: var(--color-text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      .ob-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--sp-3);
      }
      .ob-content-wrapper {
        padding: var(--sp-3) var(--sp-2);
      }
      .ob-title {
        font-size: 1rem;
        margin-bottom: var(--sp-1);
      }
      .ob-text {
        font-size: 0.8rem;
        line-height: 1.4;
      }
    }
  </style>
</head>

    <section class="section-sm" style="min-height: 50vh;">
      <div class="container">

          <div style="grid-column: 1 / -1; text-align: center; padding: var(--sp-8); color: var(--color-text-tertiary);">
            <div class="loading-spinner" style="margin: 0 auto var(--sp-3) auto;"></div>
            Loading records...
          </div>
        </div>
      </div>
    </section>
  </main>
