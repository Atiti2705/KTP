<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos Gallery — KṬP Saikhamakawn</title>
  <meta name="description" content="Browse through the photo gallery of KṬP Saikhamakawn church activities, worship services, choir performances, and community celebrations.">
  <meta name="keywords" content="KTP Saikhamakawn photos, gallery, church gallery, Mizo church photos">

  <!-- Open Graph -->
  <meta property="og:title" content="Photos Gallery — KṬP Saikhamakawn">
  <meta property="og:description" content="Browse through the photo gallery of KṬP Saikhamakawn church activities.">
  <meta property="og:image" content="assets/images/logo.png">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">

  <!-- Preconnect for Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css?v=99">
  <link rel="stylesheet" href="assets/css/base.css?v=99">
  <link rel="stylesheet" href="assets/css/mizo-patterns.css?v=99">
  <link rel="stylesheet" href="assets/css/animations.css?v=99">
  <link rel="stylesheet" href="assets/css/components.css?v=99">
  <link rel="stylesheet" href="assets/css/layout.css?v=99">
  <link rel="stylesheet" href="assets/css/pages.css?v=99">
</head>
<body>
  <!-- Header -->
  <header class="site-header" id="site-header"></header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Page Header -->
    <section class="page-title-section mizo-pattern-subtle" style="padding: var(--sp-6) 0 var(--sp-4) 0;">
      <div class="container">
        <h1 class="reveal" style="font-size: clamp(1.8rem, 4vw, 2.2rem); margin-bottom: 0;">📸 Photos Gallery</h1>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="section-sm">
      <div class="container">
        <div style="display: flex; flex-direction: column; gap: var(--sp-4); margin-bottom: var(--sp-6);">

          <!-- Category Chips -->
          <div>
            <p style="font-size: var(--fs-xs); color: var(--color-text-tertiary); font-weight: var(--fw-semibold); margin-bottom: var(--sp-2); text-transform: uppercase; letter-spacing: 0.5px;">Categories</p>
            <div class="filter-bar no-scrollbar" id="category-chips" style="overflow-x: auto; padding-bottom: var(--sp-1);">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Selection Toolbar for Bulk Download -->
          <div id="selection-toolbar" style="display: none; align-items: center; justify-content: space-between; background: var(--color-bg-elevated); padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); border: 1px solid var(--color-border); box-shadow: var(--shadow-sm); margin-top: var(--sp-2);">
            <div style="display: flex; align-items: center; gap: var(--sp-3);">
              <label style="display: flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-medium);">
                <input type="checkbox" id="select-all-cb" style="width: 16px; height: 16px; cursor: pointer;">
                Select All
              </label>
              <span id="selected-count" style="font-size: var(--fs-xs); color: var(--color-text-secondary); background: var(--color-bg-hover); padding: 2px 8px; border-radius: 12px; font-weight: var(--fw-bold);">0</span>
            </div>
            <div style="display: flex; gap: var(--sp-1); align-items: center;">
              <button id="btn-bulk-save" class="btn-icon" disabled title="Save Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
              <button id="btn-bulk-download" class="btn-icon" disabled title="Download Selected" style="opacity: 0.5; transition: opacity var(--transition-base); padding: 6px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #ffffff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>
            </div>
          </div>

          <!-- Results count/info and Sort -->
          <div class="results-info">
            <span class="results-count" id="gallery-count">Loading photos...</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <label for="gallery-sort" style="font-size: 12px; color: var(--color-text-tertiary); font-weight: var(--fw-medium);">Sort:</label>
              <select id="gallery-sort" class="filter-select" style="padding: 4px 8px; padding-right: 24px; font-size: 13px; height: 30px; border-radius: var(--radius-md); background-position: right 8px center; background-size: 12px; border: 1px solid var(--color-border); background-color: var(--color-bg-card); cursor: pointer;">
                <option value="manual">Manual</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="a-z">A-Z</option>
                <option value="z-a">Z-A</option>
              </select>
            </div>
          </div>

        </div>

        <!-- Masonry Grid -->
        <div class="masonry-grid" id="gallery-grid">
          <!-- Populated by JS -->
        </div>

        <!-- Load More Button -->
        <button id="load-more-btn" class="btn btn-outline load-more-btn reveal" style="display: none;">
          🔄 Load More Photos
        </button>

      </div>
    </section>

    <!-- AdSense Placeholder -->
    <section class="section-sm">
      <div class="container">
        <div class="footer-adsense" style="margin: 0 auto; max-width: 728px;">
          Reserved for Google AdSense — Responsive Ad Unit
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- Scripts -->
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=99"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=99"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=99"></script>

  <!-- JSZip & FileSaver for Bulk Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js?v=99"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js?v=99"></script>

  <!-- App Configuration & Services -->
  <script src="assets/js/firebase-config.js?v=99"></script>
  <script src="assets/js/theme.js?v=99"></script>
  <script src="assets/js/data.js?v=99"></script>
  <script src="assets/js/auth.js?v=99"></script>
  <script src="assets/js/db-service.js?v=99"></script>
  <script src="assets/js/save-service.js?v=99"></script>
  <script src="assets/js/components.js?v=99"></script>
  <script src="assets/js/search.js?v=99"></script>
  <script src="assets/js/gallery.js?v=99"></script>
  <script src="assets/js/app.js?v=99"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('photos');
      renderFooter();
    });
  </script>
</body>
</html>
