
>   <script>
      let currentSearch = '';
      let currentCategoryFilter = 'All';
  
      document.addEventListener('DOMContentLoaded', () => {
        if (typeof Toast !== 'undefined') Toast.init();
  
        // Load settings to fetch customized category list synchronously from localStorage cache
        const settings = AdminData.get('settings');
        if (settings && settings.LyricCategories && Array.isArray(settings.LyricCategories)) {
          LyricCategories.length = 0;
          LyricCategories.push('All', ...settings.LyricCategories.filter(c => c !== 'All'));
        }
  
        populateCategoryDropdowns();
        renderDocsTable();
        setupEvents();
        initSortable();
      });
  
      function populateCategoryDropdowns() {
        const filterSelect = document.getElementById('admin-filter-category');
        const formSelect = document.getElementById('lyric-category');
        if (!filterSelect || !formSelect) return;
  
        filterSelect.innerHTML = '<option value="All">All Categories</option>';
        formSelect.innerHTML = '<option value="" disabled selected>Select category...</option>';
  
        LyricCategories.forEach(cat => {
          if (cat !== 'All') {
            const opt1 = document.createElement('option');
            opt1.value = cat;
            opt1.textContent = cat;
            filterSelect.appendChild(opt1);
  
            const opt2 = document.createElement('option');
            opt2.value = cat;
            opt2.textContent = cat;
            formSelect.appendChild(opt2);
          }
        });
  
        renderCatEditorChips();
      }
  
      /* --- Inline Category Editor --- */
      function renderCatEditorChips() {
        const container = document.getElementById('lyric-cat-chips');
        if (!container) return;
        const cats = LyricCategories.filter(c => c !== 'All');
        container.innerHTML = cats.map(cat => `
          <span class="cat-chip" style="display:inline-flex; align-items:center; gap:4px;">
            ${cat}
            <button type="button" class="cat-rename" data-cat="${cat}" title="Rename '${cat}'" 
style="background:none;border:none;cursor:pointer;font-size:12px;">??</button>
            <button type="button" class="cat-remove" data-cat="${cat}" title="Remove '${cat}'">&times;</button>
          </span>
        `).join('');
        container.querySelectorAll('.cat-remove').forEach(btn => {
          btn.addEventListener('click', () => removeCategoryAndSave(btn.dataset.cat));
        });
        container.querySelectorAll('.cat-rename').forEach(btn => {
          btn.addEventListener('click', () => renameCategoryAndSave(btn.dataset.cat));
        });
      }
  
      async function renameCategoryAndSave(oldName) {
        const newName = prompt(`Rename category '${oldName}' to:`, oldName);
        if (!newName || newName.trim() === '' || newName === oldName) return;
        
        const trimmedName = newName.trim();
        const idx = LyricCategories.indexOf(oldName);
        if (idx > -1) {
          if (LyricCategories.includes(trimmedName)) {
            alert(`Category '${trimmedName}' already exists.`);
            return;
          }
          
          LyricCategories[idx] = trimmedName;
          saveCategorySettings();
          populateCategoryDropdowns();
          
          const docs = AdminData.get('lyrics');
          for (const doc of docs) {
            if (doc.category === oldName) {
              doc.category = trimmedName;
              await AdminData.update('lyrics', doc.id, { category: trimmedName });
            }
          }
          
          renderDocsTable();
        }
      }
  
      function removeCategoryAndSave(catName) {
        const idx = LyricCategories.indexOf(catName);
        if (idx > -1) {
          LyricCategories.splice(idx, 1);
          saveCategorySettings();
          populateCategoryDropdowns();
        }
      }
  
      function addCategoryAndSave(catName) {
        const name = catName.trim();
        if (!name || LyricCategories.includes(name)) return;
        LyricCategories.push(name);
        saveCategorySettings();
        populateCategoryDropdowns();
      }
  
      function saveCategorySettings() {
        const settings = AdminData.get('settings') || {};
        settings.LyricCategories = LyricCategories.filter(c => c !== 'All');
        AdminData.save('settings', settings);
      }
  
      function renderDocsTable() {
        const tbody = document.getElementById('docs-table-body');
        if (!tbody) return;
  
        const docs = AdminData.get('lyrics');
  
        let filtered = docs;
        if (currentSearch.trim()) {
          const q = currentSearch.toLowerCase();
          filtered = filtered.filter(d => d.title.toLowerCase().includes(q) || 
d.description.toLowerCase().includes(q));
        }
        if (currentCategoryFilter !== 'All') {
          filtered = filtered.filter(d => d.category === currentCategoryFilter);
        }
  
        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" style="text-align: center; color: var(--color-text-secondary); padding: var(--sp-6);">
                No lyrics found matching filters.
              </td>
            </tr>
          `;
          return;
        }
  
        tbody.innerHTML = filtered.map(doc => `
          <tr data-id="${doc.id}">
            <td style="text-align: center;">
              <input type="checkbox" class="row-checkbox" value="${doc.id}" style="cursor: pointer; width: 16px; 
height: 16px;">
            </td>
            <td style="text-align: center; cursor: grab; font-size: 20px; color: var(--color-text-tertiary);" 
class="drag-handle" title="Drag to reorder">?</td>
            <td>
              <div class="file-icon file-icon-${doc.fileType.toLowerCase()}" style="width: 40px; height: 40px; 
font-size: 10px;">${doc.fileType}</div>
            </td>
            <td style="font-weight: var(--fw-semibold);">${doc.title}</td>
            <td><span class="badge badge-gold">${doc.category}</span></td>
            <td>?? ${formatDate(doc.date)}</td>
            <td>${doc.fileSize}</td>
            <td>${doc.featured ? '? Yes' : 'No'}</td>
            <td>
              <div class="table-actions">
                <button class="btn btn-outline btn-sm" onclick="openEditModal('${doc.id}')" style="padding:4px 8px; 
font-size:12px;" title="Edit Lyric">??</button>
                <button class="btn btn-outline btn-sm" onclick="confirmDeleteDoc('${doc.id}')" style="padding:4px 8px; 
font-size:12px; color:var(--brand-red);" title="Delete Lyric">?</button>
              </div>
            </td>
          </tr>
        `).join('');
  
        // Attach event listeners to new row checkboxes
        document.querySelectorAll('.row-checkbox').forEach(cb => {
          cb.addEventListener('change', updateBulkDeleteUI);
        });
        // Reset select-all state when table re-renders
        const selectAllCb = document.getElementById('select-all-checkbox');
        if (selectAllCb) selectAllCb.checked = false;
        updateBulkDeleteUI();
      }
  
      function initSortable() {
        const tbody = document.getElementById('docs-table-body');
        if (typeof Sortable === 'undefined' || !tbody) return;
  
        new Sortable(tbody, {
          animation: 150,
          handle: '.drag-handle',
          onEnd: async function () {
            // If a search or filter is active, don't allow sorting 
            // (it would mess up global ordering unexpectedly)
            if (currentSearch.trim() || currentCategoryFilter !== 'All') {
              AdminToast.show('Cannot reorder items while search or filter is active. Please clear filters first.', 
'error');
              renderDocsTable(); // Reset table
              return;
            }
  
            const rows = tbody.querySelectorAll('tr[data-id]');
            const newOrderIds = Array.from(rows).map(row => row.getAttribute('data-id'));
            
            try {
              await AdminData.reorder('lyrics', newOrderIds);
              AdminToast.show('lyrics reordered successfully!', 'success');
            } catch (e) {
              console.error(e);
              AdminToast.show('Failed to save new order.', 'error');
              renderDocsTable(); // Revert
            }
          }
        });
      }
  
      function setupEvents() {
        // Category editor toggle
        document.getElementById('btn-toggle-cat-editor').addEventListener('click', () => {
          document.getElementById('lyric-cat-editor').classList.toggle('open');
        });
        document.getElementById('btn-add-new-cat').addEventListener('click', () => {
          const input = document.getElementById('lyric-new-cat-input');
          addCategoryAndSave(input.value);
          input.value = '';
        });
        document.getElementById('lyric-new-cat-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-add-new-cat').click(); }
        });
  
        // Toggle source
        const docSourceRadios = document.getElementsByName('lyric-source');
        const uploadContainer = document.getElementById('lyric-upload-container');
        const urlContainer = document.getElementById('lyric-url-container');
        
        const toggleDocSource = (source) => {
          if (source === 'upload') {
            uploadContainer.style.display = 'block';
            urlContainer.style.display = 'none';
            document.getElementById('lyric-url').required = false;
          } else {
            uploadContainer.style.display = 'none';
            urlContainer.style.display = 'block';
            document.getElementById('lyric-url').required = true;
          }
        };
  
        docSourceRadios.forEach(radio => {
          radio.addEventListener('change', (e) => toggleDocSource(e.target.value));
        });
  
        // Search
        document.getElementById('admin-search-input').addEventListener('input', (e) => {
          currentSearch = e.target.value;
          renderDocsTable();
        });
  
        // Category filter dropdown
        document.getElementById('admin-filter-category').addEventListener('change', (e) => {
          currentCategoryFilter = e.target.value;
          renderDocsTable();
        });
  
        // Bulk Delete Selection Logic
        const selectAllCb = document.getElementById('select-all-checkbox');
        const bulkDeleteBtn = document.getElementById('btn-bulk-delete');
  
        if (selectAllCb) {
          selectAllCb.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            document.querySelectorAll('.row-checkbox').forEach(cb => {
              cb.checked = isChecked;
            });
            updateBulkDeleteUI();
          });
        }
  
        if (bulkDeleteBtn) {
          bulkDeleteBtn.addEventListener('click', async () => {
            const selectedCbs = document.querySelectorAll('.row-checkbox:checked');
            if (selectedCbs.length === 0) return;
  
            if (confirm(`Are you sure you want to delete the ${selectedCbs.length} selected Lyric(s)? This cannot be 
undone.`)) {
              try {
                bulkDeleteBtn.disabled = true;
                bulkDeleteBtn.innerHTML = '? Deleting...';
                
                for (const cb of selectedCbs) {
                  await AdminData.delete('lyrics', cb.value);
                }
                
                AdminToast.show(`Successfully deleted ${selectedCbs.length} Lyric(s).`, 'success');
                renderDocsTable();
              } catch (err) {
                console.error("Error deleting lyrics:", err);
                AdminToast.show('Error during bulk deletion: ' + (err.message || 'Permission denied'), 'error');
              } finally {
                bulkDeleteBtn.disabled = false;
                bulkDeleteBtn.innerHTML = '??? Delete Selected';
                updateBulkDeleteUI();
              }
            }
          });
        }
  
        // Show Add Modal
        document.getElementById('btn-add-doc').addEventListener('click', () => {
          document.getElementById('lyric-crud-form').reset();
          document.getElementById('lyric-action-type').value = 'add';
          document.getElementById('modal-form-title').textContent = 'Add New Lyric';
          document.getElementById('lyric-date').value = new Date().toISOString().split('T')[0];
          document.querySelector('input[name="lyric-source"][value="upload"]').checked = true;
          toggleDocSource('upload');
          ModalSystem.open('lyric-form-modal');
        });
  
        // Close modal actions
        const closeModal = () => ModalSystem.close('lyric-form-modal');
        document.getElementById('close-lyric-modal').addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);
  
        // Form Submit (Save/Update)
        document.getElementById('lyric-crud-form').addEventListener('submit', async (e) => {
          e.preventDefault();
  
          const actionType = document.getElementById('lyric-action-type').value;
          const docId = document.getElementById('lyric-edit-id').value;
  
          const title = document.getElementById('lyric-title').value;
          const category = document.getElementById('lyric-category').value;
          const description = document.getElementById('lyric-desc').value;
          const fileType = document.getElementById('lyric-type').value;
          const fileSize = document.getElementById('lyric-size').value;
          const date = document.getElementById('lyric-date').value;
          const featured = document.getElementById('lyric-featured').checked;
  
          const source = document.querySelector('input[name="lyric-source"]:checked').value;
          const urlInput = document.getElementById('lyric-url');
  
          const submitBtn = e.target.querySelector('button[type="submit"]');
          const originalBtnText = submitBtn.innerHTML;
  
          try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '? Saving...';
  
            let isFolderImport = false;
            let docsToSave = [];
  
            if (source === 'url') {
              const urlVal = urlInput.value.trim();
              const folderIdMatch = urlVal.match(/(?:\/folders\/|\/drive\/folders\/)([a-zA-Z0-9_-]+)/);
  
              if (folderIdMatch && folderIdMatch[1] && actionType === 'add') {
                isFolderImport = true;
                submitBtn.innerHTML = '? Importing Folder...';
                const folderId = folderIdMatch[1];
                
                if (typeof googleDriveApiKey === 'undefined' || !googleDriveApiKey) {
                  throw new Error("Google Drive API key is missing in firebase-config.js!");
                }
  
                const apiEndpoint = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType!
='application/vnd.google-apps.folder'&fields=files(id,name,size,mimeType)&key=${googleDriveApiKey}`;
                
                const res = await fetch(apiEndpoint);
                if (!res.ok) {
                  throw new Error("Failed to fetch folder from Google Drive. Ensure the folder is public ('Anyone with 
the link').");
                }
                const data = await res.json();
                if (data.files && data.files.length > 0) {
                  data.files.forEach(file => {
                    let fType = 'PDF';
                    if (file.mimeType.includes('wordprocessingml') || file.mimeType.includes('msword')) fType = 'DOCX';
                    
                    let fSizeStr = 'Unknown';
                    if (file.size) {
                      const mb = parseInt(file.size) / (1024 * 1024);
                      fSizeStr = mb >= 1 ? `${mb.toFixed(1)} MB` : `${(parseInt(file.size) / 1024).toFixed(0)} KB`;
                    }
                    
                    let cleanTitle = file.name.replace(/\.[^/.]+$/, "");
                    
                    docsToSave.push({
                      title: cleanTitle,
                      category,
                      description,
                      fileType: fType,
                      fileSize: fSizeStr,
                      date,
                      featured,
                      downloadUrl: convertDriveUrl(`https://drive.google.com/file/d/${file.id}/view`, 'file')
                    });
                  });
                } else {
                  throw new Error("No files found in this Google Drive folder!");
                }
              } else {
                docsToSave.push({
                  title, category, description, fileType, fileSize, date, featured,
                  downloadUrl: convertDriveUrl(urlVal, 'file')
                });
              }
            } else {
              docsToSave.push({
                title, category, description, fileType, fileSize, date, featured,
                downloadUrl: '#'
              });
            }
  
            if (actionType === 'add') {
              for (const docObj of docsToSave) {
                await AdminData.add('lyrics', docObj);
              }
              if (isFolderImport) {
                AdminToast.show(`Successfully imported ${docsToSave.length} lyrics from folder!`, 'success');
              } else {
                AdminToast.show('Lyric added successfully!', 'success');
              }
            } else {
              const updatedFields = {
                title,
                category,
                description,
                fileType,
                fileSize,
                date,
                featured
              };
              if (source === 'url') {
                updatedFields.downloadUrl = docsToSave[0].downloadUrl;
              } else {
                updatedFields.downloadUrl = '#';
              }
              await AdminData.update('lyrics', docId, updatedFields);
              AdminToast.show('Lyric updated!', 'success');
            }
  
            closeModal();
            renderDocsTable();
          } catch (err) {
            console.error("Error saving Lyric:", err);
            AdminToast.show('Error saving Lyric: ' + (err.message || 'Permission denied'), 'error');
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
          }
        });
  
        // Expose toggle internally for edit modal
        window._toggleDocSource = toggleDocSource;
      }
  
      function updateBulkDeleteUI() {
        const selectedCount = document.querySelectorAll('.row-checkbox:checked').length;
        const totalCount = document.querySelectorAll('.row-checkbox').length;
        const bulkDeleteBtn = document.getElementById('btn-bulk-delete');
        const selectAllCb = document.getElementById('select-all-checkbox');
  
        if (bulkDeleteBtn) {
          bulkDeleteBtn.style.display = selectedCount > 0 ? 'inline-block' : 'none';
          bulkDeleteBtn.textContent = `??? Delete Selected (${selectedCount})`;
        }
  
        if (selectAllCb && totalCount > 0) {
          selectAllCb.checked = selectedCount === totalCount;
          selectAllCb.indeterminate = selectedCount > 0 && selectedCount < totalCount;
        }
      }
  
      // Exposed to onclick triggers
      window.openEditModal = function (id) {
        const docs = AdminData.get('lyrics');
        const doc = docs.find(d => d.id === id);
        if (!doc) return;
  
        document.getElementById('lyric-action-type').value = 'edit';
        document.getElementById('lyric-edit-id').value = id;
        document.getElementById('modal-form-title').textContent = 'Edit Lyric Details';
  
        document.getElementById('lyric-title').value = doc.title;
        document.getElementById('lyric-category').value = doc.category;
        document.getElementById('lyric-desc').value = doc.description;
        document.getElementById('lyric-type').value = doc.fileType;
        document.getElementById('lyric-size').value = doc.fileSize;
        document.getElementById('lyric-date').value = doc.date;
        document.getElementById('lyric-featured').checked = doc.featured;
  
        const isExternal = doc.downloadUrl && doc.downloadUrl !== '#';
        if (isExternal) {
          document.querySelector('input[name="lyric-source"][value="url"]').checked = true;
          document.getElementById('lyric-url').value = doc.downloadUrl;
          if (window._toggleDocSource) window._toggleDocSource('url');
        } else {
          document.querySelector('input[name="lyric-source"][value="upload"]').checked = true;
          document.getElementById('lyric-url').value = '';
          if (window._toggleDocSource) window._toggleDocSource('upload');
        }
  
        ModalSystem.open('lyric-form-modal');
      };
  
      window.confirmDeleteDoc = async function (id) {
        const docs = AdminData.get('lyrics');
        const doc = docs.find(d => d.id === id);
        if (!doc) return;
  
        if (confirm(`Are you sure you want to delete the publication "${doc.title}"?`)) {
          try {
            await AdminData.delete('lyrics', id);
            AdminToast.show('Lyric deleted.', 'info');
            renderDocsTable();
          } catch (err) {
            console.error("Error deleting Lyric:", err);
            AdminToast.show('Error deleting Lyric: ' + (err.message || 'Permission denied'), 'error');
          }
        }
      };
    </script>
  </body>
  
  </html>
